  *{box-sizing:border-box;margin:0;padding:0;}

  canvas{display:block;background:#000;

  #touch{position:fixed;inset:0;pointer-events:none;z-index:20;display:none;}
  #joyzone{position:absolute;left:0;bottom:0;width:38vmin;height:38vmin;
    min-width:180px;min-height:180px;pointer-events:auto;touch-action:none;}
  #joybase{position:absolute;left:6vmin;bottom:6vmin;
    width:22vmin;height:22vmin;min-width:110px;min-height:110px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,

    box-shadow:0 0 24px rgba(255,140,40,.35), inset 0 0 24px rgba(255,140,40,.25);}
  #joybase.on{box-shadow:0 0 40px rgba(255,180,60,.75),
               inset 0 0 30px rgba(255,140,40,.5);}
  #joybase::after{content:"";position:absolute;inset:20%;border-radius:50%;
    border:1px dashed rgba(255,200,120,.35);}
  #joyknob{position:absolute;left:50%;top:50%;
    width:10vmin;height:10vmin;min-width:48px;min-height:48px;
    transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle at 40% 30%,
      #fff0c8, #ffae3a 45%, #c25a10 100%);

  .tick{position:absolute;width:0;height:0;border-left:5px solid transparent;

  .tick.d{transform:translate(-50%,-50%) rotate(180deg) translateY(-8.5vmin);}
  .tick.l{transform:translate(-50%,-50%) rotate(-90deg) translateY(-8.5vmin);}
  .tick.r{transform:translate(-50%,-50%) rotate(90deg)  translateY(-8.5vmin);}

    width:34vmin;height:34vmin;min-width:170px;min-height:170px;pointer-events:none;}
  .abtn{position:absolute;pointer-events:auto;touch-action:none;

  .abtn.on{transform:scale(1.12);border-color:#ffd98a;
    box-shadow:0 0 32px rgba(255,200,80,.9),

    background:radial-gradient(circle at 35% 30%,
      #ffe9b0, #ff9a30 60%, #b0340a);}

  #b-kick   {left:50%;top:100%;transform:translate(-50%,-100%);}
  #b-block  {left:0;top:50%;   transform:translate(0,-50%);}

<script>
"use strict";
/* =====================================================================
   MIYA BHAI — NO ONE CAN ESCAPE
   Story Mode · HD Graphics · Time Travel Beat-'Em-Up
   ===================================================================== */

const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d', {alpha:false});
const W = 1280, H = 720, GROUND = 610;
const ROUNDS_TO_WIN = 2;
const ROUND_TIME = 60;

/* ---------- utils ---------- */
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const rand  = (a,b)=> a+Math.random()*(b-a);
const rint  = (a,b)=> Math.floor(rand(a,b+1));
const midi  = n => 440*Math.pow(2,(n-69)/12);
function hexRGB(hex){ const n=parseInt(hex.slice(1),16); return [(n>>16)&0xff,(n>>8)&0xff,n&0xff]; }
function rgbToHex(r,g,b){ r=clamp(r|0,0,255);g=clamp(g|0,0,255);b=clamp(b|0,0,255);
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0'); }
function shade(hex, amt){ const [r,g,b]=hexRGB(hex); return rgbToHex(r+amt,g+amt,b+amt); }
function rectOverlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

/* ---------- big text helper ---------- */
function bigText(txt, x, y, size, color, alpha, scale, outline){
  ctx.save();
  ctx.globalAlpha = (alpha==null)?1:alpha;
  ctx.translate(x,y);
  if(scale && scale!==1) ctx.scale(scale,scale);
  ctx.font = '900 '+size+'px "Arial Black", Arial, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineJoin='round';
  ctx.lineWidth = Math.max(3, size*0.14);
  ctx.strokeStyle = outline || '#000';
  ctx.strokeText(txt, 0, 0);
  const c1 = (color && color[0]) || color || '#fff';
  const c2 = (color && color[1]) || color || '#fff';
  const g = ctx.createLinearGradient(0, -size*0.6, 0, size*0.6);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g;
  ctx.fillText(txt, 0, 0);
  ctx.restore();
}
function panelText(txt, x, y, size, color, align){
  ctx.save();
  ctx.font = '900 '+size+'px "Arial Black", Arial, sans-serif';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.strokeStyle = '#000';
  ctx.strokeText(txt, x, y);
  ctx.fillStyle = color || '#fff';
  ctx.fillText(txt, x, y);
  ctx.restore();
}

/* =====================================================================
   AUDIO
   ===================================================================== */
const SFX = {
  ctx:null, master:null, sfxBus:null, musBus:null, noiseBuf:null, ready:false,
  init(){
    if(this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = 0.8;
    this.master.connect(this.ctx.destination);
    this.sfxBus = this.ctx.createGain(); this.sfxBus.gain.value = 0.9;
    this.sfxBus.connect(this.master);
    this.musBus = this.ctx.createGain(); this.musBus.gain.value = 0.26;
    this.musBus.connect(this.master);
    const len = Math.floor(this.ctx.sampleRate*2);
    this.noiseBuf = this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    this.ready = true;
  },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  now(){ return this.ctx ? this.ctx.currentTime : 0; },
  tone(freq,dur,type,vol,when,slideTo,bus){
    if(!this.ready) return;
    type=type||'sine'; vol=(vol==null)?0.3:vol;
    const c=this.ctx, t=(when==null?c.currentTime:when);
    const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(Math.max(20,freq),t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(bus||this.sfxBus);
    o.start(t); o.stop(t+dur+0.05);
  },
  noise(dur,vol,fType,f0,f1,when,q,bus){
    if(!this.ready) return;
    fType=fType||'lowpass'; f0=f0||1000; q=q||1;
    const c=this.ctx, t=(when==null?c.currentTime:when);
    const src=c.createBufferSource(); src.buffer=this.noiseBuf; src.loop=true;
    const flt=c.createBiquadFilter(); flt.type=fType; flt.Q.value=q;
    flt.frequency.setValueAtTime(Math.max(20,f0),t);
    if(f1) flt.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    const g=c.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(flt); flt.connect(g); g.connect(bus||this.sfxBus);
    src.start(t); src.stop(t+dur+0.05);
  },
  play(n){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    switch(n){
      case 'whoosh': this.noise(0.14,0.22,'bandpass',1700,320,t,1.4); break;
      case 'hit': this.tone(180,0.13,'square',0.28,t,70); this.tone(85,0.20,'sine',0.48,t,42);
        this.noise(0.11,0.36,'highpass',900,null,t); break;
      case 'bigHit': this.tone(120,0.30,'square',0.36,t,45); this.tone(55,0.42,'sine',0.6,t,28);
        this.noise(0.22,0.45,'lowpass',2400,200,t); break;
      case 'block': this.tone(1250,0.07,'square',0.16,t,720);
        this.noise(0.06,0.24,'highpass',2600,null,t); break;
      case 'jump': this.tone(280,0.15,'sine',0.20,t,640); break;
      case 'land': this.noise(0.11,0.24,'lowpass',340,null,t); break;
      case 'move': this.tone(430,0.035,'square',0.12,t); break;
      case 'confirm': this.tone(523,0.09,'square',0.22,t); this.tone(784,0.16,'square',0.22,t+0.08); break;
      case 'ko': this.tone(300,1.2,'sawtooth',0.38,t,48); this.tone(90,1.4,'sine',0.48,t,32);
        this.noise(1.1,0.45,'lowpass',1600,90,t); break;
      case 'special': this.tone(200,0.34,'sawtooth',0.22,t,1500);
        this.noise(0.34,0.20,'bandpass',600,3200,t,2.4); break;
      case 'fire': this.noise(0.55,0.32,'lowpass',1900,380,t);
        this.tone(130,0.45,'sawtooth',0.16,t,60); break;
      case 'coin': this.tone(1900,0.07,'square',0.12,t,2500); break;
      case 'roar': this.tone(95,0.9,'sawtooth',0.38,t,52); this.noise(0.8,0.32,'lowpass',650,140,t); break;
      case 'ghost': this.tone(700,0.5,'sine',0.15,t,180);
        this.noise(0.5,0.15,'bandpass',1400,300,t,3); break;
      case 'win': [523,659,784,1046].forEach((f,i)=> this.tone(f,0.36,'square',0.22,t+i*0.13)); break;
      case 'lose': [392,330,262,196].forEach((f,i)=> this.tone(f,0.42,'sawtooth',0.19,t+i*0.18)); break;
      case 'announce': this.tone(160,0.55,'sawtooth',0.24,t,110);
        this.noise(0.45,0.20,'lowpass',900,null,t); break;
      case 'combo': this.tone(900,0.06,'square',0.18,t); this.tone(1400,0.06,'square',0.14,t+0.05); break;
      case 'fatality': this.tone(80,1.8,'sawtooth',0.45,t,32); this.tone(120,1.6,'sine',0.35,t,40);
        this.tone(240,1.2,'square',0.15,t,80); this.noise(1.5,0.4,'lowpass',700,120,t); break;
      case 'portal': this.tone(200,1.2,'sine',0.22,t,1400);
        this.tone(300,1.0,'sawtooth',0.10,t,2000);
        this.noise(1.2,0.20,'bandpass',300,3000,t,2); break;
      case 'cheer': [523,659,784].forEach((f,i)=> this.tone(f, 0.5, 'square', 0.20, t+i*0.05)); break;
    }
  }
};

const PATTERNS = {

  fight2:{ bpm:164, len:16, bass:[38,38,null,38,41,null,38,null,36,36,null,36,43,null,41,null],
    lead:[62,65,67,65,62,60,62,null,62,65,67,70,69,67,65,null],

  hell:{ bpm:172, len:16, bass:[36,36,null,36,39,null,36,null,34,34,null,34,41,null,39,null],
    lead:[60,63,65,63,60,58,60,null,60,63,65,68,67,65,63,null],
    drum:[2,1,1,0,2,1,1,1,2,1,1,0,2,1,1,1] },
  ko:{ bpm:70, len:16, bass:[33,null,null,null,33,null,null,null,31,null,null,null,36,null,null,null],
    lead:[57,null,null,null,55,null,null,null,53,null,null,null,52,null,null,null],
    drum:[2,0,0,0,0,0,0,0,2,0,0,0,0,0,1,0] },
  victory:{ bpm:132, len:16, bass:[40,null,45,null,47,null,45,null,40,null,43,null,45,null,47,null],
    lead:[64,67,72,71,69,67,64,null,64,67,72,76,74,72,69,null],
    drum:[2,0,1,0,2,0,1,0,2,0,1,0,2,1,1,1] },
  peaceful:{ bpm:82, len:16, bass:[41,null,null,null,45,null,null,null,48,null,null,null,45,null,43,null],
    lead:[69,null,72,null,76,null,74,null,72,null,69,null,67,null,64,null],
    drum:[2,0,0,0,0,0,1,0,2,0,0,0,0,0,1,1] }
};
const Music = {
  timer:null, step:0, next:0, pattern:null, playing:null,
  start(name){
    if(!SFX.ready) return;
    if(this.playing === name) return;
    this.stop();
    const pat = PATTERNS[name]; if(!pat) return;
    this.playing = name; this.pattern = pat;
    this.step = 0; this.next = SFX.now()+0.08;
    this.timer = setInterval(()=>this.tick(), 25);
  },
  stop(){ if(this.timer) clearInterval(this.timer); this.timer=null; this.playing=null; this.pattern=null; },
  tick(){
    if(!SFX.ready || !this.pattern) return;
    const spb = 60/this.pattern.bpm/2;
    while(this.next < SFX.now()+0.18){
      this.schedule(this.step, this.next, spb);
      this.next += spb;
      this.step = (this.step+1) % this.pattern.len;
    }
  },
  schedule(step, time, spb){
    const p = this.pattern;
    const b = p.bass[step % p.bass.length];
    if(b!=null) SFX.tone(midi(b), spb*1.6, 'sawtooth', 0.18, time, null, SFX.musBus);
    const l = p.lead ? p.lead[step % p.lead.length] : null;
    if(l!=null) SFX.tone(midi(l), spb*0.9, 'square', 0.06, time, null, SFX.musBus);
    const d = p.drum ? p.drum[step % p.drum.length] : 0;
    if(d===1) SFX.noise(0.045, 0.14, 'highpass', 6500, null, time, 1, SFX.musBus);
    if(d===2){ SFX.tone(62, 0.13, 'sine', 0.42, time, 32, SFX.musBus);
      SFX.noise(0.06, 0.11, 'lowpass', 220, null, time, 1, SFX.musBus); }
  }
};

/* =====================================================================
   INPUT
   ===================================================================== */
const Input = {}; const JustPressed = {};
const Button = { punch:false, kick:false, block:false, special:false };
const ButtonPressed = { punch:false, kick:false, block:false, special:false };
const ButtonT = { punch:0, kick:0, block:0, special:0 };
const KEYMAP = {
  left:['ArrowLeft','KeyA'], right:['ArrowRight','KeyD'],
  up:['ArrowUp','KeyW'], down:['ArrowDown','KeyS'],
  punch:['KeyJ','KeyZ'], kick:['KeyK','KeyX'],
  block:['Space','ShiftLeft','ShiftRight'], special:['KeyL','KeyC'],
  confirm:['Enter','NumpadEnter'], back:['Escape','Backspace']
};
const JoyHeld = { left:false,right:false,up:false,down:false };
const JoyTapped = { left:false,right:false,up:false,down:false };
function held(a){
  if(a==='left'||a==='right'||a==='up'||a==='down') return JoyHeld[a] || KEYMAP[a].some(k=>Input[k]);
  return KEYMAP[a].some(k=>Input[k]) || !!Button[a];
}
function tapped(a){
  if(a==='left'||a==='right'||a==='up'||a==='down') return JoyTapped[a] || KEYMAP[a].some(k=>JustPressed[k]);
  return KEYMAP[a].some(k=>JustPressed[k]) || !!ButtonPressed[a];
}
window.addEventListener('keydown', e=>{
  if(!e.repeat) JustPressed[e.code] = true;
  Input[e.code] = true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  firstInteract();
});
window.addEventListener('keyup', e=>{ Input[e.code] = false; });

const joy = {
  active:false, id:null,
  baseEl: document.getElementById('joybase'),
  knobEl: document.getElementById('joyknob'),
  zoneEl: document.getElementById('joyzone'),
  cx:0, cy:0, R:0, dx:0, dy:0
};
function joyLayout(){
  const r = joy.baseEl.getBoundingClientRect();
  joy.cx = r.left + r.width/2; joy.cy = r.top + r.height/2;
  joy.R  = r.width*0.42;
}
setTimeout(joyLayout, 60);
window.addEventListener('resize', ()=>setTimeout(joyLayout,80));
window.addEventListener('orientationchange', ()=>setTimeout(joyLayout,300));
function joyMove(clientX, clientY){
  let dx = clientX - joy.cx, dy = clientY - joy.cy;
  const len = Math.hypot(dx,dy);
  if(len > joy.R){ dx = dx/len*joy.R; dy = dy/len*joy.R; }
  joy.dx = dx/joy.R; joy.dy = dy/joy.R;
  joy.knobEl.style.transform = 'translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px))';
  updateJoyDirs();
}
function joyReset(){
  joy.active=false; joy.id=null; joy.dx=0; joy.dy=0;
  joy.knobEl.style.transform='translate(-50%,-50%)';
  joy.baseEl.classList.remove('on');
  updateJoyDirs();
}
function updateJoyDirs(){
  const T = 0.32, nx = joy.dx, ny = joy.dy;
  const old = { left:JoyHeld.left, right:JoyHeld.right, up:JoyHeld.up, down:JoyHeld.down };
  JoyHeld.left = nx < -T; JoyHeld.right = nx > T;
  JoyHeld.up   = ny < -T; JoyHeld.down  = ny > T;
  if(JoyHeld.left  && !old.left)  JoyTapped.left = true;
  if(JoyHeld.right && !old.right) JoyTapped.right = true;
  if(JoyHeld.up    && !old.up)    JoyTapped.up = true;
  if(JoyHeld.down  && !old.down)  JoyTapped.down = true;
}
joy.zoneEl.addEventListener('pointerdown', e=>{
  e.preventDefault();
  if(joy.active) return;
  joy.active=true; joy.id=e.pointerId;
  joyLayout(); joy.baseEl.classList.add('on');
  joyMove(e.clientX, e.clientY);
  firstInteract();
  try{ joy.zoneEl.setPointerCapture(e.pointerId); }catch(_){}
});
joy.zoneEl.addEventListener('pointermove', e=>{
  if(!joy.active || e.pointerId !== joy.id) return;
  e.preventDefault(); joyMove(e.clientX, e.clientY);
});
joy.zoneEl.addEventListener('pointerup', e=>{ if(e.pointerId===joy.id) joyReset(); });
joy.zoneEl.addEventListener('pointercancel', e=>{ if(e.pointerId===joy.id) joyReset(); });

document.querySelectorAll('.abtn').forEach(el=>{
  const act = el.id.replace('b-','');
  const press = e=>{
    e.preventDefault(); e.stopPropagation();
    if(!Button[act]) ButtonPressed[act]=true;
    Button[act]=true; ButtonT[act]=1;
    el.classList.add('on');
    firstInteract();
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
  };
  const release = e=>{
    e.preventDefault(); e.stopPropagation();
    Button[act]=false;
    el.classList.remove('on');
  };
  el.addEventListener('pointerdown', press);
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('pointerleave', e=>{ if(Button[act]) release(e); });
  el.addEventListener('contextmenu', e=>e.preventDefault());
});

  const r = cv.getBoundingClientRect();
  const sx = (r.width>0) ? W/r.width : 1;
  const sy = (r.height>0) ? H/r.height : 1;
  return { x:(clientX - r.left)*sx, y:(clientY - r.top)*sy };
}

  cv.style.width  = Math.max(320, Math.floor(W*s)) + 'px';
  cv.style.height = Math.max(180, Math.floor(H*s)) + 'px';
}

const Particles = {
  pool:[], n:600, cursor:0,
  init(){ for(let i=0;i<this.n;i++) this.pool.push({alive:false}); },
  spawn(cfg){
    const p = this.pool[this.cursor]; this.cursor = (this.cursor+1)%this.n;
    p.alive=true; p.t=0;
    p.x=cfg.x; p.y=cfg.y;
    p.vx=cfg.vx||0; p.vy=cfg.vy||0;
    p.life=cfg.life||0.5; p.r=cfg.r||3;
    p.color=cfg.color||'#fff';
    p.gravity=(cfg.gravity!=null)?cfg.gravity:700;
    p.drag=(cfg.drag!=null)?cfg.drag:0.985;
    p.kind=cfg.kind||'spark';
    p.glow=cfg.glow||false; p.shrink=cfg.shrink!==false;
    return p;
  },
  update(dt){
    for(let i=0;i<this.pool.length;i++){
      const p=this.pool[i]; if(!p.alive) continue;
      p.t+=dt; if(p.t>=p.life){ p.alive=false; continue; }
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      p.vy+=p.gravity*dt;
      p.vx*=p.drag; p.vy*=p.drag;
    }
  },
  draw(g){
    g.globalAlpha=1;
    for(let i=0;i<this.pool.length;i++){
      const p=this.pool[i]; if(!p.alive) continue;
      const a=1-p.t/p.life; const r=p.shrink?p.r*a:p.r;
      g.globalAlpha=a;
      if(p.kind==='spark'||p.kind==='dust'||p.kind==='ember'){
        if(p.glow){
          const grd=g.createRadialGradient(p.x,p.y,0,p.x,p.y,r*3);
          grd.addColorStop(0,p.color); grd.addColorStop(1,'rgba(0,0,0,0)');
          g.fillStyle=grd; g.beginPath(); g.arc(p.x,p.y,r*3,0,7); g.fill();
        } else { g.fillStyle=p.color; g.beginPath(); g.arc(p.x,p.y,r,0,7); g.fill(); }
      } else if(p.kind==='ring'){
        g.strokeStyle=p.color; g.lineWidth=3*a;
        g.beginPath(); g.arc(p.x,p.y,r*4,0,7); g.stroke();
      }
    }
    g.globalAlpha=1;
  }
};

/* =====================================================================
   FIGHTER CLASS
   ===================================================================== */
class Fighter {
  constructor(def, x, facing, isPlayer){
    this.def = def; this.name = def.name; this.pal = def.pal;
    this.outfit = def.outfit; this.s = def.scale || 1.7;
    this.isPlayer = !!isPlayer; this.maxHp = def.hp;
    this.reset(x, facing);
  }
  reset(x, facing){
    this.x=x; this.y=GROUND;
    this.vx=0; this.vy=0; this.facing=facing;
    this.hp=this.maxHp; this.onGround=true;
    this.state='idle'; this.animT=Math.random()*3;
    this.attack=null; this.hitstun=0; this.blocking=false;
    this.specialCd=0; this.cool=0;
    this.flash=0; this.hitFlash=0;
    this.dead=false; this.frozen=false;
    this.fall=0; this.foe=null;
    this.aiT=0; this.aiAct='approach';
    this.pose=computePose(this);
    this.clothT=Math.random()*3;
    this.victoryPose=0;
  }
  get floating(){ return !!this.def.floating; }
  update(dt, inp){
    this.animT+=dt; this.clothT+=dt;
    if(this.flash>0) this.flash-=dt;
    if(this.hitFlash>0) this.hitFlash-=dt;
    if(this.specialCd>0) this.specialCd-=dt;
    if(this.cool>0) this.cool-=dt;
    const foe = this.foe;
    if(this.dead){
      this.vy+=2100*dt; this.x+=this.vx*dt; this.y+=this.vy*dt;
      if(this.y>=GROUND){ this.y=GROUND; if(this.vy>200) SFX.play('land');
        this.vy=0; this.vx*=0.86; }
      this.x=clamp(this.x,80,1200);
      this.fall=Math.min(1, this.fall+dt*3.2);
      this.pose=computePose(this); return;
    }
    if(this.frozen){
      this.vx*=0.85; this.vy+=2100*dt;
      this.y=Math.min(GROUND, this.y+this.vy*dt);
      if(this.y>=GROUND){ this.y=GROUND; this.vy=0; }
      this.state='win'; this.attack=null;
      this.pose=computePose(this); return;
    }
    if(this.hitstun>0){
      this.hitstun-=dt; this.state='hit';
      this.blocking=false; this.vx*=Math.pow(0.02,dt);
    }
    if(this.attack) this.updateAttack(dt);
    else if(this.hitstun<=0) this.control(dt, inp||{});
    if(this.floating){ this.y=GROUND-46+Math.sin(this.animT*2.1)*8; this.onGround=true; }
    else{
      this.vy+=2100*dt; this.y+=this.vy*dt;
      if(this.y>=GROUND){
        if(!this.onGround){ SFX.play('land'); emitDust(this.x,GROUND,6); }
        this.y=GROUND; this.vy=0; this.onGround=true;
      } else this.onGround=false;
    }
    this.x+=this.vx*dt; this.x=clamp(this.x,80,1200);
    if(this.onGround && !this.attack && this.hitstun<=0) this.vx*=Math.pow(0.0015,dt);
    if(!this.attack && this.hitstun<=0 && foe && !foe.dead && !this.frozen)
      this.facing = foe.x>=this.x?1:-1;
    this.pose=computePose(this);
  }
  control(dt, inp){
    const def = this.def;
    this.blocking = !!inp.block && this.onGround && !this.attack;
    if(this.blocking){ this.vx*=Math.pow(0.0005,dt); this.state='block'; }
    else{
      let mx=0; if(inp.left) mx-=1; if(inp.right) mx+=1;
      if(mx!==0){ this.vx = mx*def.speed*(this.onGround?1:0.8); this.state=this.onGround?'walk':'jump'; }
      else if(this.onGround) this.state='idle';
    }
    if(inp.up && this.onGround && !this.blocking){
      this.vy=-def.jump; this.onGround=false; this.state='jump';
      SFX.play('jump'); emitDust(this.x,GROUND,5);
    }
    if(this.onGround && !this.blocking && this.cool<=0){
      if(inp.punch) this.startAttack('punch');
      else if(inp.kick) this.startAttack('kick');
      else if(inp.special && this.specialCd<=0) this.startSpecial();
    }
  }
  startAttack(type){
    this.attack = { type:type, t:0, def:MOVES[type], hit:false, spType:null, spawned:true };
    this.state=type; this.vx*=0.2; this.cool=0.16;
    SFX.play('whoosh');
  }
  startSpecial(){
    const sp = this.def.special; if(this.specialCd>0) return;
    this.specialCd = sp.cd;
    const m = SP_MOVES[sp.type];
    this.attack = { type:'special', t:0, def:m, hit:false, spType:sp.type, spawned:false };
    this.state='special'; this.vx*=0.1; this.cool=0.3;
    if(this.foe) this.facing = this.foe.x>=this.x?1:-1;
    SFX.play('special'); addShake(4);
  }
  updateAttack(dt){
    const a = this.attack; a.t+=dt;
    const m = a.def;
    const total = m.startup+m.active+m.recover;
    if(a.spType && !a.spawned && a.t >= (m.spawnAt||m.startup)){
      a.spawned=true; this.spawnSpecial(a.spType);
    }
    if(a.t>=total){ this.attack=null; this.state='idle'; }
  }
  spawnSpecial(type){
    const f=this, dir=f.facing, foe=f.foe; if(!foe) return;
    switch(type){
      case 'charge':
        SFX.play('roar'); addShake(10);
        for(let i=0;i<5;i++)
          spawnProj({ type:'horse', owner:f, pierce:true,
            x:f.x-dir*(140+i*145), y:GROUND-80, vx:dir*380, vy:0, w:200, h:150,
            damage:12, kb:280, hitstun:0.5, life:3.2 });
        break;
      case 'stomp':
        SFX.play('roar'); addShake(16);
        spawnProj({ type:'wave', owner:f, pierce:true, grow:520,
          x:f.x, y:GROUND-45, vx:dir*250, vy:0, w:110, h:100,
          damage:16, kb:320, hitstun:0.55, life:1.3 });
        emitDust(f.x,GROUND,24); break;
      case 'scepter':
        SFX.play('special');
        spawnProj({ type:'bolt', owner:f, pierce:false,
          x:f.x+dir*70, y:f.y-145, vx:dir*720, vy:0, w:80, h:30,
          damage:13, kb:220, hitstun:0.42, life:2.0 });
        break;
      case 'goldrain':
        SFX.play('coin');
        for(let i=0;i<12;i++)
          spawnProj({ type:'coin', owner:f, pierce:false,
            x:foe.x+rand(-110,110), y:-70-i*62, vx:0, vy:480, w:30, h:30,
            damage:6, kb:60, hitstun:0.18, life:5 });
        break;
      case 'fireball':
        SFX.play('fire');
        spawnProj({ type:'fire', owner:f, pierce:false,
          x:f.x+dir*72, y:f.y-138, vx:dir*560, vy:0, w:74, h:74,
          damage:14, kb:250, hitstun:0.45, life:2.2 });
        break;
      case 'gavel':
        SFX.play('bigHit'); addShake(20);
        spawnProj({ type:'shock', owner:f, pierce:true, grow:420,
          x:f.x+dir*140, y:GROUND-55, vx:0, vy:0, w:180, h:110,
          damage:18, kb:340, hitstun:0.6, life:0.55 });
        emitDust(f.x+dir*140, GROUND, 22); break;
      case 'teleport':
        SFX.play('ghost');
        emitHit(f.x, f.y-120, '#a8e0ff', false);
        const side = Math.random()<0.5?-1:1;
        f.x = clamp(foe.x + side*92, 90, 1190);
        f.facing = foe.x>=f.x?1:-1;
        emitHit(f.x, f.y-120, '#a8e0ff', false);
        if(Math.abs(f.x-foe.x)<140 && !foe.dead){
          foe.takeDamage(15, f, { kb:220, hitstun:0.5, launch:false });
          addShake(10);
        }
        break;
      case 'pillar':
        SFX.play('fire'); addShake(14);
        spawnProj({ type:'pillar', owner:f, pierce:false,
          x:foe.x, y:GROUND-165, vx:0, vy:0, w:140, h:330,
          damage:20, kb:280, hitstun:0.65, life:0.85 });
        break;
    }
  }
  takeDamage(dmg, from, move){
    if(this.dead || this.frozen) return;
    dmg *= (from.def.power || 1);
    if(from.isPlayer){
      game.comboCount++; game.comboTimer = 1.6;
      if(game.comboCount>1){ SFX.play('combo'); game.score += game.comboCount*20; }
    }
    if(this.blocking){
      this.hp -= dmg*0.16; SFX.play('block');
      this.vx = -this.facing*90;
      emitBlock(this.x + this.facing*34, this.y - 140);
      this.flash = 0.05;
    } else {
      this.hp -= dmg;
      this.hitstun = Math.max(this.hitstun, move.hitstun||0.3);
      this.vx = -this.facing*(move.kb||160)*(this.onGround?1:1.3);
      if(move.launch) this.vy = -430;
      this.flash = 0.14; this.hitFlash = 0.22;
      this.attack = null; this.blocking = false;
      const big = dmg>=14;
      SFX.play(big?'bigHit':'hit');
      emitHit(this.x + this.facing*-20, this.y-150, big?'#ff9a20':'#ffe066', big);
      emitBlood(this.x + this.facing*-20, this.y-150, -this.facing, big?22:12);
      addShake(big?14:7);
      game.hitStop = big?0.09:0.04;
      if(big) game.damageFlash = 0.4;
      game.tintFlash = { t:0, life:0.18, color: big?'255,80,20':'255,200,80' };
      game.score += Math.round(dmg*10);
    }
    if(this.hp<=0) this.hp=0;
  }
}

function computePose(f){
  const t=f.animT, st=f.state;
  const P = {
    pelvis:[0,-64], chest:[0,-102], neck:[0,-112], head:[1,-126], headR:15,
    shF:[9,-102], shB:[-9,-102],
    hipF:[8,-64], hipB:[-8,-64],
    elbowF:[19,-88], handF:[27,-108],
    elbowB:[-15,-88], handB:[-5,-106],
    kneeF:[12,-33], footF:[14,0],
    kneeB:[-12,-33], footB:[-16,0]
  };
  const bob = Math.sin(t*4.5)*1.8;
  const addBob = k=>{
    P.head[1]+=bob*k; P.neck[1]+=bob*k; P.chest[1]+=bob*k*0.6;
    P.shF[1]+=bob*k*0.9; P.shB[1]+=bob*k*0.9;
    P.elbowF[1]+=bob*k*0.9; P.handF[1]+=bob*k*0.9;
    P.elbowB[1]+=bob*k*0.9; P.handB[1]+=bob*k*0.9;
  };
  if(st==='idle') addBob(1);
  if(st==='walk'){
    const sw=Math.sin(t*13);
    P.footF=[14+sw*13, -Math.max(0,sw)*9];
    P.kneeF=[12+sw*7, -33-Math.max(0,sw)*5];
    P.footB=[-16-sw*13, -Math.max(0,-sw)*9];
    P.kneeB=[-12-sw*7, -33-Math.max(0,-sw)*5];
    addBob(0.45);
  }
  if(st==='jump'){
    P.kneeF=[22,-48]; P.footF=[28,-22];
    P.kneeB=[-8,-42]; P.footB=[-20,-10];
    P.handF=[24,-122]; P.elbowF=[18,-98];
    P.handB=[-8,-120]; P.elbowB=[-16,-98];
  }
  if(st==='block'){
    P.elbowF=[16,-92]; P.handF=[16,-120];
    P.elbowB=[-2,-92]; P.handB=[10,-106];
    P.chest[0]=-3; P.head[0]=-2;
  }
  if(st==='hit'){
    const k = clamp(f.hitstun*3,0,1);
    P.chest[0]=-8*k; P.head[0]=-13*k; P.neck[0]=-6*k;
    P.handF=[18,-100]; P.elbowF=[10,-88];
    P.handB=[-14,-98]; P.elbowB=[-20,-86];
  }
  if(st==='win'){
    addBob(1.4);
    const wp = f.victoryPose || 0;
    if(wp===0){ P.handF=[22,-152]; P.elbowF=[24,-120]; P.handB=[-22,-150]; P.elbowB=[-24,-120]; }
    else { P.handF=[30,-158]; P.elbowF=[26,-126]; P.handB=[-26,-158]; P.elbowB=[-24,-126]; }
  }
  if(f.attack){
    const a=f.attack, m=a.def;
    let ext;
    if(a.t<m.startup) ext = 0.35*(a.t/Math.max(0.001,m.startup));
    else if(a.t<m.startup+m.active) ext = 0.35+0.65*((a.t-m.startup)/Math.max(0.001,m.active));
    else ext = 0.35+0.65*(1-((a.t-m.startup-m.active)/Math.max(0.001,m.recover)));
    ext = clamp(ext,0,1);
    if(a.type==='punch'){
      P.handF=[27+ext*34,-108]; P.elbowF=[19+ext*16,-104]; P.shF=[9+ext*6,-102];
      P.chest[0]=5*ext; P.head[0]=3*ext;
    } else if(a.type==='kick'){
      P.kneeF=[12+ext*16,-33-ext*26]; P.footF=[14+ext*48,-24-ext*56];
      P.chest[0]=-5*ext; P.pelvis[0]=2*ext;
    } else if(a.spType==='uppercut'){
      P.handF=[20+ext*16,-108-ext*95]; P.elbowF=[18+ext*8,-100-ext*44];
      P.chest[0]=4*ext; P.pelvis[1]=-64+ext*4;
    } else if(a.type==='special'){
      P.handF=[26,-120]; P.elbowF=[20,-98];
      P.handB=[-6,-118]; P.elbowB=[-14,-98];
      P.chest[0]=2;
    }
  }
  return P;
}
function getHitbox(f){
  const m=f.attack.def, s=f.s;
  let x0,x1;
  if(f.facing>0){ x0=f.x+m.hx*s; x1=f.x+(m.hx+m.hw)*s; }
  else { x0=f.x-(m.hx+m.hw)*s; x1=f.x-m.hx*s; }
  const y0 = f.y+m.hy*s;
  return { x:Math.min(x0,x1), y:y0, w:Math.abs(x1-x0), h:m.lh*s };
}
function bodyBox(f){
  const k = f.s/1.7;
  return { x: f.x-28*k, y: f.y-226*k, w: 56*k, h: 226*k };
}

function spawnProj(o){
  o.t=0; o.dead=false; o.hits=new Set();
  if(o.w===undefined) o.w=30; if(o.h===undefined) o.h=30;
  game.projectiles.push(o); return o;
}
function updateProjectiles(dt){
  const p1=game.player, p2=game.enemy;
  for(let i=game.projectiles.length-1;i>=0;i--){
    const p = game.projectiles[i];
    p.t+=dt; p.x+=(p.vx||0)*dt; p.y+=(p.vy||0)*dt;
    if(p.grow) p.w += p.grow*dt;
    if(p.t>(p.life||2) || p.x<-600 || p.x>1900) p.dead=true;
    if(p.type && p.type.indexOf('fatality')===0){
      if(p.dead) game.projectiles.splice(i,1);
      continue;
    }
    const target = (p.owner===p1)?p2:p1;
    if(target && !target.dead && !p.hits.has(target)){
      const bb = bodyBox(target);
      const pb = { x:p.x-p.w/2, y:p.y-p.h/2, w:p.w, h:p.h };
      if(rectOverlap(pb,bb)){
        target.takeDamage(p.damage, p.owner, { kb:p.kb||180, hitstun:p.hitstun||0.35, launch:false });
        p.hits.add(target);
        if(p.type==='coin') SFX.play('coin');
        if(!p.pierce) p.dead=true;
      }
    }
    if(p.dead) game.projectiles.splice(i,1);
  }
}

/* =====================================================================
   CHARACTER RENDERING
   ===================================================================== */
function limbGrad(g, color, x0, x1){
  const grd = g.createLinearGradient(x0, 0, x1, 0);
  grd.addColorStop(0, shade(color, -55));
  grd.addColorStop(0.25, color);
  grd.addColorStop(0.55, shade(color, +30));
  grd.addColorStop(0.85, color);
  grd.addColorStop(1, shade(color, -35));
  return grd;
}
function limb(g, a, b, c, w, base){
  g.strokeStyle = shade(base, -80); g.lineWidth = w+5;
  g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.lineTo(c[0],c[1]); g.stroke();
  const gx = (a[0]+b[0]+c[0])/3;
  const grd = limbGrad(g, base, gx-w, gx+w);
  g.strokeStyle = grd; g.lineWidth = w;
  g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.lineTo(c[0],c[1]); g.stroke();
  g.strokeStyle = shade(base, +40); g.lineWidth = 2.5;
  g.beginPath();
  g.moveTo((a[0]+b[0])/2-3, (a[1]+b[1])/2-2);
  g.lineTo((b[0]+c[0])/2-3, (b[1]+c[1])/2-2);
  g.stroke();
}
function blob(g, p, r, base){
  g.fillStyle = shade(base, -80);
  g.beginPath(); g.arc(p[0], p[1], r+2, 0, 7); g.fill();
  const grd = g.createRadialGradient(p[0]-r*0.3, p[1]-r*0.3, r*0.1, p[0], p[1], r);
  grd.addColorStop(0, shade(base, +35));
  grd.addColorStop(1, shade(base, -30));
  g.fillStyle = grd;
  g.beginPath(); g.arc(p[0], p[1], r, 0, 7); g.fill();
}
function footShape(g, p, base, dir){
  g.save(); g.translate(p[0], p[1]);
  const grd = g.createLinearGradient(-8,-6,8,6);
  grd.addColorStop(0, shade(base, +25)); grd.addColorStop(1, shade(base, -30));
  g.fillStyle = shade(base, -80);
  g.beginPath(); g.ellipse(dir*4, -3, 14, 9, 0, 0, 7); g.fill();
  g.fillStyle = grd;
  g.beginPath(); g.ellipse(dir*4, -3, 12, 7, 0, 0, 7); g.fill();
  g.restore();
}

function drawFighter(g, f, opts){
  opts = opts || {};
  const P = f.pose, s = f.s, pal = f.pal;
  if(!P) return;
  const isGhost = f.outfit==='ghost';
  const isDevil = f.outfit==='devil';

  g.save();
  if(!opts.skipShadow){
    g.globalAlpha = 0.4;
    const shadowGrd = g.createRadialGradient(f.x, GROUND+4, 4, f.x, GROUND+4, 60);
    shadowGrd.addColorStop(0,'rgba(0,0,0,0.85)');
    shadowGrd.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = shadowGrd;
    const sw = clamp(1-(GROUND-f.y)/500, 0.35, 1);
    g.beginPath(); g.ellipse(f.x, GROUND+4, 62*sw, 14*sw, 0, 0, 7); g.fill();
    g.globalAlpha = 1;
  }

  g.translate(f.x, f.y);
  if(f.dead && f.fall>0) g.rotate(-Math.PI/2 * f.fall);
  g.scale(f.facing * s, s);
  g.lineCap='round'; g.lineJoin='round';

  if(isDevil){
    const aura = g.createRadialGradient(0,-120,20,0,-120,180);
    aura.addColorStop(0,'rgba(255,90,20,0.35)');
    aura.addColorStop(0.6,'rgba(180,30,10,0.20)');
    aura.addColorStop(1,'rgba(120,10,0,0)');
    g.fillStyle = aura;
    g.beginPath(); g.arc(0,-120,180,0,7); g.fill();
  }
  if(isGhost) g.globalAlpha = 0.85;

  const legW=17, armW=13;

  if(isGhost){
    g.save(); g.globalAlpha *= 0.8;
    const wob = Math.sin(f.animT*3)*6;
    const grd = g.createLinearGradient(0,P.pelvis[1],0,P.pelvis[1]+95);
    grd.addColorStop(0,'rgba(150,210,240,0.75)');
    grd.addColorStop(1,'rgba(120,160,200,0)');
    g.fillStyle = grd;
    g.beginPath();
    g.moveTo(P.pelvis[0]-20, P.pelvis[1]);
    g.quadraticCurveTo(P.pelvis[0]-30+wob, P.pelvis[1]+55, P.pelvis[0]-8+wob*1.6, P.pelvis[1]+98);
    g.quadraticCurveTo(P.pelvis[0]+6+wob, P.pelvis[1]+65, P.pelvis[0]+20, P.pelvis[1]);
    g.closePath(); g.fill();
    g.restore();
  }

  if(!isGhost){
    limb(g, P.hipB, P.kneeB, P.footB, legW, pal.pantsDk);
    footShape(g, P.footB, pal.shoe, -1);
  }
  limb(g, P.shB, P.elbowB, P.handB, armW, pal.skinDk);
  blob(g, P.handB, 7, pal.skinDk);

  const torsoW=40;
  g.strokeStyle = pal.shirtDk; g.lineWidth = torsoW+6;
  g.beginPath(); g.moveTo(P.pelvis[0],P.pelvis[1]); g.lineTo(P.chest[0],P.chest[1]); g.stroke();
  const tg = g.createLinearGradient(-22,0,22,0);
  tg.addColorStop(0, pal.shirtDk); tg.addColorStop(0.4, pal.shirt);
  tg.addColorStop(0.65, pal.shirtLt); tg.addColorStop(1, pal.shirtDk);
  g.strokeStyle = tg; g.lineWidth = torsoW;
  g.beginPath(); g.moveTo(P.pelvis[0],P.pelvis[1]); g.lineTo(P.chest[0],P.chest[1]); g.stroke();

  g.strokeStyle = shade(pal.shirtDk, -20); g.lineWidth = 1.6;
  g.beginPath();
  g.moveTo(P.chest[0]-10, P.chest[1]+4);
  g.quadraticCurveTo(P.chest[0]-6, P.chest[1]+22, P.pelvis[0]-4, P.pelvis[1]-4);
  g.stroke();
  g.beginPath();
  g.moveTo(P.chest[0]+10, P.chest[1]+4);
  g.quadraticCurveTo(P.chest[0]+6, P.chest[1]+22, P.pelvis[0]+4, P.pelvis[1]-4);
  g.stroke();
  g.strokeStyle = shade(pal.shirt, +25); g.lineWidth = 2;
  g.beginPath();
  g.moveTo(P.chest[0]-14, P.chest[1]-4);
  g.quadraticCurveTo(P.chest[0]-4, P.chest[1]+6, P.chest[0], P.chest[1]-2);
  g.stroke();
  g.beginPath();
  g.moveTo(P.chest[0]+14, P.chest[1]-4);
  g.quadraticCurveTo(P.chest[0]+4, P.chest[1]+6, P.chest[0], P.chest[1]-2);
  g.stroke();

  drawOutfitBack(g, f, P);
  drawHead(g, f, P);

  if(!isGhost){
    limb(g, P.hipF, P.kneeF, P.footF, legW, pal.pants);
    footShape(g, P.footF, pal.shoe, 1);
  }
  limb(g, P.shF, P.elbowF, P.handF, armW, pal.skin);
  blob(g, P.handF, 7.5, pal.skin);

  drawOutfitFront(g, f, P);

  if(f.hitFlash>0){
    g.globalAlpha = f.hitFlash*2.4;
    g.fillStyle = '#ff6060';
    g.beginPath(); g.ellipse(0,-105,52,122,0,0,7); g.fill();
  }
  g.restore();
}

function drawHead(g, f, P){
  const pal = f.pal;
  const hx = P.head[0], hy = P.head[1], r = P.headR;

  g.strokeStyle = shade(pal.skinDk, -30); g.lineWidth = 18;
  g.beginPath(); g.moveTo(P.neck[0], P.neck[1]+6); g.lineTo(hx, hy+r*0.6); g.stroke();
  g.strokeStyle = pal.skinDk; g.lineWidth = 15;
  g.beginPath(); g.moveTo(P.neck[0], P.neck[1]+6); g.lineTo(hx, hy+r*0.6); g.stroke();

  g.fillStyle = shade(pal.skinDk, -70);
  g.beginPath(); g.arc(hx, hy, r+1.4, 0, 7); g.fill();
  const hg = g.createRadialGradient(hx-r*0.3, hy-r*0.4, r*0.1, hx, hy, r);
  hg.addColorStop(0, pal.skinLt);
  hg.addColorStop(0.6, pal.skin);
  hg.addColorStop(1, pal.skinDk);
  g.fillStyle = hg;
  g.beginPath(); g.arc(hx, hy, r, 0, 7); g.fill();

  g.fillStyle = pal.skinDk;
  g.beginPath(); g.ellipse(hx-r*0.85, hy+r*0.05, r*0.24, r*0.34, 0,0,7); g.fill();

  g.fillStyle = shade(pal.skinDk, -10);
  g.beginPath();
  g.moveTo(hx+r*0.78, hy-r*0.05);
  g.lineTo(hx+r*0.98, hy+r*0.25);
  g.lineTo(hx+r*0.75, hy+r*0.3);
  g.closePath(); g.fill();

  const bg = g.createLinearGradient(hx, hy+r*0.2, hx, hy+r*1.3);
  bg.addColorStop(0, pal.hairLt); bg.addColorStop(1, pal.hair);
  g.fillStyle = bg;
  g.beginPath(); g.ellipse(hx, hy+r*0.5, r*0.88, r*0.85, 0,0,7); g.fill();
  g.strokeStyle = shade(pal.hair, -20); g.lineWidth = 1.2;
  for(let i=-2;i<=2;i++){
    g.beginPath();
    g.moveTo(hx + i*r*0.24, hy + r*0.15);
    g.quadraticCurveTo(hx + i*r*0.28, hy + r*0.7, hx + i*r*0.20, hy + r*1.15);
    g.stroke();
  }

  g.strokeStyle = pal.hair; g.lineWidth = 2.6; g.lineCap='round';
  g.beginPath();
  g.moveTo(hx + r*0.10, hy - r*0.42); g.lineTo(hx + r*0.68, hy - r*0.36);
  g.stroke();
  g.beginPath();
  g.moveTo(hx - r*0.14, hy - r*0.40); g.lineTo(hx + r*0.28, hy - r*0.44);
  g.stroke();

  const blink = Math.sin(f.animT*1.9) > 0.985;
  if(!blink){
    g.fillStyle = '#f4efe6';
    g.beginPath(); g.ellipse(hx+r*0.42, hy-r*0.14, r*0.24, r*0.17, 0,0,7); g.fill();
    g.beginPath(); g.ellipse(hx+r*0.02, hy-r*0.14, r*0.19, r*0.16, 0,0,7); g.fill();
    const pupilX = hx + r*0.42 + (f.foe && f.foe.x>f.x ? 1 : -1)*r*0.05;
    g.fillStyle = '#1a1208';
    g.beginPath(); g.arc(pupilX, hy-r*0.14, r*0.11, 0, 7); g.fill();
    g.beginPath(); g.arc(hx + r*0.04, hy-r*0.14, r*0.10, 0, 7); g.fill();
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(pupilX-r*0.03, hy-r*0.18, r*0.04, 0, 7); g.fill();
  } else {
    g.strokeStyle = '#1a1208'; g.lineWidth = 1.8;
    g.beginPath(); g.moveTo(hx+r*0.18, hy-r*0.14); g.lineTo(hx+r*0.62, hy-r*0.14); g.stroke();
    g.beginPath(); g.moveTo(hx-r*0.20, hy-r*0.14); g.lineTo(hx+r*0.22, hy-r*0.14); g.stroke();
  }

  g.strokeStyle = shade(pal.hair, +10); g.lineWidth = 1.6;
  g.beginPath();
  g.moveTo(hx-r*0.15, hy+r*0.34);
  g.quadraticCurveTo(hx, hy+r*0.4, hx+r*0.15, hy+r*0.34);
  g.stroke();

  if(f.outfit==='devil'){
    g.fillStyle = '#e8dcc0';
    g.strokeStyle = '#5a3010'; g.lineWidth = 1.5;
    g.beginPath();
    g.moveTo(hx-r*0.75, hy-r*0.68);
    g.quadraticCurveTo(hx-r*1.7, hy-r*1.55, hx-r*0.72, hy-r*2.0);
    g.quadraticCurveTo(hx-r*0.9, hy-r*1.1, hx-r*0.28, hy-r*0.86);
    g.closePath(); g.fill(); g.stroke();
    g.beginPath();
    g.moveTo(hx+r*0.75, hy-r*0.68);
    g.quadraticCurveTo(hx+r*1.7, hy-r*1.55, hx+r*0.72, hy-r*2.0);
    g.quadraticCurveTo(hx+r*0.9, hy-r*1.1, hx+r*0.28, hy-r*0.86);
    g.closePath(); g.fill(); g.stroke();
    g.fillStyle = 'rgba(255,200,60,0.9)';
    g.beginPath(); g.arc(hx+r*0.42, hy-r*0.14, r*0.13, 0, 7); g.fill();
    g.beginPath(); g.arc(hx+r*0.04, hy-r*0.14, r*0.13, 0, 7); g.fill();
  }
  if(f.outfit==='ghost'){
    g.fillStyle = '#b0f0ff';
    g.beginPath(); g.arc(hx+r*0.42, hy-r*0.14, r*0.14, 0, 7); g.fill();
    g.beginPath(); g.arc(hx+r*0.04, hy-r*0.14, r*0.14, 0, 7); g.fill();
  }

  // MIYA BHAI — Islamic white cap (kufi, rounded dome, no brim)
  if(f.outfit==='miya'){
    g.fillStyle = shade(pal.cap, -70);
    g.beginPath();
    g.arc(hx, hy - r*0.20, r*1.0, Math.PI*1.0, Math.PI*2.0);
    g.fill();
    g.fillRect(hx - r*1.0, hy - r*0.26, r*2.0, r*0.10);
    const capGrd = g.createLinearGradient(hx, hy-r*1.3, hx, hy);
    capGrd.addColorStop(0, pal.cap);
    capGrd.addColorStop(0.6, shade(pal.cap, -8));
    capGrd.addColorStop(1, pal.capDk);
    g.fillStyle = capGrd;
    g.beginPath();
    g.arc(hx, hy - r*0.20, r*0.98, Math.PI*1.02, Math.PI*1.98);
    g.fill();
    g.fillStyle = shade(pal.cap, -20);
    g.fillRect(hx - r*0.98, hy - r*0.26, r*1.96, r*0.13);
    g.strokeStyle = shade(pal.cap, -45); g.lineWidth = 1.4;
    g.beginPath();
    g.moveTo(hx - r*0.98, hy - r*0.14); g.lineTo(hx + r*0.98, hy - r*0.14);
    g.stroke();
    g.strokeStyle = shade(pal.cap, -18); g.lineWidth = 1;
    for(let i=-2;i<=2;i++){
      g.beginPath();
      g.moveTo(hx + i*r*0.30, hy - r*0.32);
      g.quadraticCurveTo(hx + i*r*0.28, hy - r*0.85, hx + i*r*0.18, hy - r*1.05);
      g.stroke();
    }
  }

  if(f.outfit==='general'){
    g.fillStyle = shade(pal.cap, -50);
    g.beginPath(); g.arc(hx, hy-r*0.2, r*1.08, Math.PI*1.0, Math.PI*2.0); g.fill();
    const cg = g.createLinearGradient(hx, hy-r*1.4, hx, hy);
    cg.addColorStop(0, pal.cap); cg.addColorStop(1, pal.capDk);
    g.fillStyle = cg;
    g.beginPath(); g.arc(hx, hy-r*0.2, r*1.05, Math.PI*1.0, Math.PI*2.0); g.fill();
    g.fillRect(hx-r*1.05, hy-r*0.24, r*2.10, r*0.24);
    g.fillStyle = pal.accent;
    g.fillRect(hx-r*1.05, hy-r*0.28, r*2.10, r*0.09);
    g.fillStyle = '#ffd24a';
    g.beginPath(); g.arc(hx, hy-r*0.82, r*0.14, 0, 7); g.fill();
  }
  if(f.outfit==='king'){
    const cg = g.createLinearGradient(hx, hy-r*1.8, hx, hy-r*0.6);
    cg.addColorStop(0,'#ffe27a'); cg.addColorStop(1,'#a8801a');
    g.fillStyle = cg;
    g.beginPath();
    g.moveTo(hx-r*0.95, hy-r*0.78); g.lineTo(hx-r*0.95, hy-r*1.55);
    g.lineTo(hx-r*0.45, hy-r*1.05); g.lineTo(hx, hy-r*1.7);
    g.lineTo(hx+r*0.45, hy-r*1.05); g.lineTo(hx+r*0.95, hy-r*1.55);
    g.lineTo(hx+r*0.95, hy-r*0.78); g.closePath(); g.fill();
    g.strokeStyle = '#5a3010'; g.lineWidth = 1.4; g.stroke();
    const jewels = [-0.6,0,0.6];
    for(let i=0;i<jewels.length;i++){
      const jx = jewels[i];
      g.fillStyle = jx===0?'#e04060':'#2060d0';
      g.beginPath(); g.arc(hx+jx*r*0.7, hy-r*0.95, r*0.14, 0, 7); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.7)';
      g.beginPath(); g.arc(hx+jx*r*0.7-r*0.04, hy-r*0.99, r*0.05, 0, 7); g.fill();
    }
  }
  if(f.outfit==='pharaoh'){
    const hg1 = g.createLinearGradient(hx-r*1.4, 0, hx+r*1.4, 0);
    hg1.addColorStop(0,'#123060'); hg1.addColorStop(0.5,'#2f5fb0'); hg1.addColorStop(1,'#123060');
    g.fillStyle = hg1;
    g.beginPath();
    g.moveTo(hx-r*1.15, hy-r*0.9); g.lineTo(hx+r*1.15, hy-r*0.9);
    g.lineTo(hx+r*1.38, hy+r*1.15); g.lineTo(hx+r*0.6, hy+r*1.15);
    g.lineTo(hx+r*0.75, hy+r*0.1); g.lineTo(hx-r*0.75, hy+r*0.1);
    g.lineTo(hx-r*0.6, hy+r*1.15); g.lineTo(hx-r*1.38, hy+r*1.15);
    g.closePath(); g.fill();
    g.strokeStyle = '#e8c34a'; g.lineWidth = 2.2;
    for(let i=-2;i<=2;i++){
      g.beginPath();
      g.moveTo(hx+i*r*0.42, hy-r*0.92); g.lineTo(hx+i*r*0.42, hy+r*1.1);
      g.stroke();
    }
    g.fillStyle = '#ffd24a';
    g.beginPath(); g.ellipse(hx, hy-r*0.72, r*0.26, r*0.16, 0, 0, 7); g.fill();
  }
  if(f.outfit==='magician'){
    const mg = g.createLinearGradient(hx-r*1.3, hy-r*2.5, hx+r*1.3, hy-r*0.5);
    mg.addColorStop(0,'#1a1442'); mg.addColorStop(0.5,'#3a3278'); mg.addColorStop(1,'#1a1442');
    g.fillStyle = mg;
    g.beginPath();
    g.moveTo(hx-r*1.32, hy-r*0.55); g.lineTo(hx+r*1.32, hy-r*0.55);
    g.lineTo(hx+r*0.35, hy-r*2.5); g.lineTo(hx-r*0.35, hy-r*2.5);
    g.closePath(); g.fill();
    g.fillStyle = '#0e0a30';
    g.beginPath(); g.ellipse(hx, hy-r*0.55, r*1.4, r*0.22, 0, 0, 7); g.fill();
    g.fillStyle = pal.accent;
    g.beginPath(); g.ellipse(hx, hy-r*0.78, r*0.42, r*0.14, 0, 0, 7); g.fill();
    const starGrd = g.createRadialGradient(hx, hy-r*1.6, 0, hx, hy-r*1.6, r*0.6);
    starGrd.addColorStop(0,'#ffffff'); starGrd.addColorStop(0.5, pal.accent);
    starGrd.addColorStop(1,'rgba(125,227,255,0)');
    g.fillStyle = starGrd;
    g.beginPath(); g.arc(hx, hy-r*1.6, r*0.6, 0, 7); g.fill();
    g.fillStyle = '#ffffff';
    g.beginPath(); g.arc(hx, hy-r*1.6, r*0.18, 0, 7); g.fill();
  }
  if(f.outfit==='judge'){
    const bgr = g.createLinearGradient(hx, hy+r*0.3, hx, hy+r*1.4);
    bgr.addColorStop(0,'#e8e0cc'); bgr.addColorStop(1,'#a89a80');
    g.fillStyle = bgr;
    g.beginPath(); g.ellipse(hx, hy+r*0.65, r*1.08, r*1.16, 0,0,7); g.fill();
    g.strokeStyle = '#7a6a52'; g.lineWidth = 1.2;
    for(let i=-2;i<=2;i++){
      g.beginPath();
      g.moveTo(hx+i*r*0.3, hy+r*0.2);
      g.quadraticCurveTo(hx+i*r*0.4, hy+r*1.0, hx+i*r*0.2, hy+r*1.7);
      g.stroke();
    }
    g.fillStyle = pal.skinLt;
    g.beginPath(); g.arc(hx, hy-r*0.2, r*0.94, Math.PI*1.0, Math.PI*2.0); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.35)';
    g.beginPath(); g.ellipse(hx-r*0.35, hy-r*0.6, r*0.35, r*0.18, -0.5, 0, 7); g.fill();
  }
}

function drawOutfitBack(g, f, P){
  const pal = f.pal;
  if(f.outfit==='king'){
    const flap = Math.sin(f.clothT*2.5)*5;
    const cg = g.createLinearGradient(P.chest[0]-16, P.chest[1], P.pelvis[0]-40, P.pelvis[1]+60);
    cg.addColorStop(0,'rgba(150,80,200,0.95)');
    cg.addColorStop(1,'rgba(60,20,100,0.95)');
    g.fillStyle = cg;
    g.beginPath();
    g.moveTo(P.chest[0]-16, P.chest[1]-6);
    g.quadraticCurveTo(P.chest[0]-70+flap, P.chest[1]+60, P.chest[0]-46+flap, P.pelvis[1]+60);
    g.lineTo(P.pelvis[0]+8, P.pelvis[1]+50);
    g.quadraticCurveTo(P.chest[0]-6, P.chest[1]+30, P.chest[0]+10, P.chest[1]-4);
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(230,195,74,0.6)'; g.lineWidth = 2; g.stroke();
  }
  if(f.outfit==='devil'){
    const flap = Math.sin(f.clothT*4)*10;
    const wg = g.createLinearGradient(-60,-180,-140,40);
    wg.addColorStop(0,'rgba(120,20,15,0.95)');
    wg.addColorStop(1,'rgba(30,5,3,0.95)');
    g.fillStyle = wg;
    g.beginPath();
    g.moveTo(P.chest[0]-14, P.chest[1]-4);
    g.quadraticCurveTo(P.chest[0]-100, P.chest[1]-95-flap, P.chest[0]-140, P.chest[1]+20);
    g.quadraticCurveTo(P.chest[0]-80, P.chest[1]+10, P.chest[0]-50, P.chest[1]+52);
    g.quadraticCurveTo(P.chest[0]-40, P.chest[1]+10, P.chest[0]-14, P.chest[1]+10);
    g.closePath(); g.fill();
  }
  if(f.outfit==='magician'){
    g.strokeStyle = '#7a5a2a'; g.lineWidth = 6; g.lineCap='round';
    g.beginPath();
    g.moveTo(P.handB[0]-6, P.handB[1]+40);
    g.lineTo(P.handB[0]+4, P.handB[1]-50);
    g.stroke();
    const gx = P.handB[0]+4, gy = P.handB[1]-56;
    const rg = g.createRadialGradient(gx,gy,0,gx,gy,24);
    rg.addColorStop(0,'rgba(255,255,255,0.95)');
    rg.addColorStop(0.3,'rgba(160,240,255,0.8)');
    rg.addColorStop(1,'rgba(60,180,255,0)');
    g.fillStyle = rg;
    g.beginPath(); g.arc(gx,gy,24,0,7); g.fill();
  }
  if(f.outfit==='general'){
    const flap = Math.sin(f.clothT*2.2)*4;
    g.fillStyle = 'rgba(60,20,20,0.9)';
    g.beginPath();
    g.moveTo(P.shB[0]-8, P.shB[1]-6);
    g.quadraticCurveTo(P.shB[0]-55, P.shB[1]+40+flap, P.shB[0]-32, P.pelvis[1]+20);
    g.lineTo(P.pelvis[0]+6, P.pelvis[1]+30);
    g.quadraticCurveTo(P.shB[0]-8, P.chest[1]+30, P.shB[0]+6, P.shB[1]-2);
    g.closePath(); g.fill();
    g.strokeStyle = pal.accent; g.lineWidth = 2; g.stroke();
  }
}

function drawOutfitFront(g, f, P){
  const pal = f.pal;
  if(f.outfit==='general'){
    const eg = g.createRadialGradient(P.shF[0], P.shF[1]-3, 2, P.shF[0], P.shF[1], 12);
    eg.addColorStop(0,'#ffe080'); eg.addColorStop(1, pal.accent);
    g.fillStyle = eg;
    g.beginPath(); g.ellipse(P.shF[0], P.shF[1], 12, 8, 0,0,7); g.fill();
    g.beginPath(); g.ellipse(P.shB[0], P.shB[1], 12, 8, 0,0,7); g.fill();
    g.fillStyle = '#2a1a10'; g.fillRect(P.pelvis[0]-20, P.pelvis[1]-6, 40, 12);
    g.fillStyle = pal.accent;
    g.beginPath();
    g.moveTo(P.pelvis[0]-8, P.pelvis[1]-7); g.lineTo(P.pelvis[0], P.pelvis[1]);
    g.lineTo(P.pelvis[0]+8, P.pelvis[1]-7); g.lineTo(P.pelvis[0]+8, P.pelvis[1]+6);
    g.lineTo(P.pelvis[0], P.pelvis[1]+9); g.lineTo(P.pelvis[0]-8, P.pelvis[1]+6);
    g.closePath(); g.fill();
    for(let i=0;i<3;i++){
      g.fillStyle = i===1?'#e04030':'#ffd24a';
      g.beginPath(); g.arc(P.chest[0]-6+i*6, P.chest[1]+10+i*6, 4, 0, 7); g.fill();
    }
  }
  if(f.outfit==='rich'){
    for(let c=0;c<3;c++){
      const cy = P.chest[1]+6+c*9;
      const cw = 22-c*4;
      g.strokeStyle = c===0?'#ffe27a':(c===1?'#ffd24a':'#e0b030');
      g.lineWidth = 3;
      g.beginPath();
      g.moveTo(P.chest[0]-cw/2, cy-3);
      g.quadraticCurveTo(P.chest[0], cy+cw*0.5, P.chest[0]+cw/2, cy-3);
      g.stroke();
    }
    g.fillStyle = '#ffe27a';
    g.beginPath(); g.arc(P.handF[0], P.handF[1]-3, 3.4, 0, 7); g.fill();
    g.fillStyle = '#3a2212'; g.fillRect(P.pelvis[0]-18, P.pelvis[1]-5, 36, 10);
    g.fillStyle = '#ffe27a';
    g.beginPath(); g.arc(P.pelvis[0], P.pelvis[1], 6, 0, 7); g.fill();
  }
  if(f.outfit==='judge'){
    g.save();
    g.translate(P.handF[0], P.handF[1]);
    g.rotate(-0.4);
    g.fillStyle = '#5a3a1a'; g.fillRect(-4, -4, 8, 40);
    const hg = g.createLinearGradient(-14,-18,14,0);
    hg.addColorStop(0,'#7a5030'); hg.addColorStop(1,'#3a2410');
    g.fillStyle = hg; g.fillRect(-16, -22, 32, 20);
    g.strokeStyle = '#3a2410'; g.lineWidth = 1.4; g.strokeRect(-16,-22,32,20);
    g.restore();
  }
  if(f.outfit==='pharaoh'){
    g.fillStyle = '#e8c34a';
    g.beginPath(); g.arc(P.chest[0], P.chest[1]+16, 9, 0, 7); g.fill();
    g.fillStyle = '#1f4fa0';
    g.beginPath(); g.arc(P.chest[0], P.chest[1]+16, 4.5, 0, 7); g.fill();
    g.fillStyle = '#1f3f6e'; g.fillRect(P.pelvis[0]-18, P.pelvis[1]-5, 36, 10);
    g.fillStyle = '#e8c34a';
    g.beginPath(); g.arc(P.pelvis[0], P.pelvis[1], 5.5, 0, 7); g.fill();
  }
  if(f.outfit==='miya'){
    g.strokeStyle = '#c8c8c8'; g.lineWidth = 2;
    g.beginPath(); g.arc(P.chest[0], P.chest[1]+14, 8, 0, 7); g.stroke();
    g.fillStyle = '#c8c8c8';
    g.beginPath(); g.arc(P.chest[0], P.chest[1]+22, 3.5, 0, 7); g.fill();
  }
  if(f.outfit==='king'){
    g.fillStyle = '#3a2440'; g.fillRect(P.pelvis[0]-18, P.pelvis[1]-5, 36, 10);
    g.fillStyle = '#e8c34a';
    g.beginPath(); g.arc(P.pelvis[0], P.pelvis[1], 6, 0, 7); g.fill();
  }
  if(f.outfit==='magician'){
    for(let i=0;i<3;i++){
      const ra = f.clothT*2 + i*2.1;
      const rx = Math.cos(ra)*32; const ry = Math.sin(ra)*14 - 100;
      const a = 0.5 + Math.sin(f.clothT*4+i)*0.3;
      g.fillStyle = 'rgba(125,227,255,'+a+')';
      g.beginPath(); g.arc(rx, ry, 2.5, 0, 7); g.fill();
    }
  }
  if(f.outfit==='devil'){
    g.strokeStyle = '#5a0a06'; g.lineWidth = 2;
    g.beginPath();
    g.moveTo(P.chest[0]-8, P.chest[1]+4); g.lineTo(P.chest[0]+6, P.chest[1]+24);
    g.stroke();
    g.beginPath();
    g.moveTo(P.chest[0]+8, P.chest[1]+4); g.lineTo(P.chest[0]-6, P.chest[1]+24);
    g.stroke();
  }
}

/* projectile rendering */
function drawHorseSil(g, x, y, s, color){
  g.save(); g.translate(x,y); g.scale(s,s);
  g.fillStyle = color;
  g.beginPath(); g.ellipse(0,-30,34,17,0,0,7); g.fill();
  g.beginPath();
  g.moveTo(24,-40); g.lineTo(46,-62); g.lineTo(58,-58);
  g.lineTo(52,-48); g.lineTo(38,-30); g.closePath(); g.fill();
  g.fillRect(-24,-18,7,20); g.fillRect(-8,-16,7,18);
  g.fillRect(12,-18,7,20); g.fillRect(22,-16,7,18);
  g.beginPath(); g.moveTo(-32,-38); g.lineTo(-52,-22); g.lineTo(-34,-26); g.fill();
  g.beginPath(); g.ellipse(0,-62,9,14,0,0,7); g.fill();
  g.beginPath(); g.arc(0,-78,7,0,7); g.fill();
  g.restore();
}
function drawProjectile(g, p){
  switch(p.type){
    case 'horse': {
      const dir = Math.sign(p.vx)||1;
      g.save(); g.translate(p.x, p.y+78); g.scale(dir, 1);
      for(let i=0;i<5;i++){
        g.fillStyle = 'rgba(200,160,110,'+(0.5-i*0.09)+')';
        g.beginPath();
        g.ellipse(-70-i*24, -6+Math.sin(p.t*12+i)*3, 30-i*4, 14-i*2, 0,0,7);
        g.fill();
      }
      drawHorseSil(g, 0, 0, 1.15, '#3a2214');
      drawHorseSil(g, -35, 4, 0.85, '#4a2e1c');
      g.restore(); break;
    }
    case 'wave': {
      const a = 1-p.t/(p.life||1);
      g.save(); g.globalAlpha = clamp(a,0,1);
      const wg = g.createLinearGradient(0, GROUND-100, 0, GROUND);
      wg.addColorStop(0,'rgba(255,220,150,0.3)');
      wg.addColorStop(0.5,'rgba(230,180,100,0.95)');
      wg.addColorStop(1,'rgba(120,80,30,0.6)');
      g.fillStyle = wg;
      g.beginPath();
      g.moveTo(p.x-p.w/2, GROUND);
      g.quadraticCurveTo(p.x, GROUND-p.h*1.2, p.x+p.w/2, GROUND);
      g.closePath(); g.fill();
      g.restore(); break;
    }
    case 'shock': {
      const a = 1-p.t/(p.life||1);
      g.save(); g.globalAlpha = clamp(a,0,1);
      g.strokeStyle = '#ffd06a'; g.lineWidth = 10;
      g.beginPath(); g.ellipse(p.x, GROUND-8, p.w/2, p.h/2, 0, 0, 7); g.stroke();
      g.strokeStyle = 'rgba(255,255,220,0.9)'; g.lineWidth = 5;
      g.beginPath(); g.ellipse(p.x, GROUND-8, p.w/2.6, p.h/2.6, 0, 0, 7); g.stroke();
      g.restore(); break;
    }
    case 'bolt': {
      g.save(); g.translate(p.x, p.y);
      g.rotate(p.vx>0?0:Math.PI);
      const grd = g.createLinearGradient(-40,0,40,0);
      grd.addColorStop(0,'rgba(255,220,120,0)');
      grd.addColorStop(0.5,'rgba(255,230,140,0.95)');
      grd.addColorStop(1,'rgba(255,255,220,0.9)');
      g.fillStyle = grd;
      g.beginPath(); g.ellipse(0,0,42,14,0,0,7); g.fill();
      g.fillStyle = '#fff6c0';
      g.beginPath(); g.ellipse(14,0,16,8,0,0,7); g.fill();
      g.restore(); break;
    }
    case 'coin': {
      g.save(); g.translate(p.x, p.y);
      const sc = Math.abs(Math.cos(p.t*12));
      g.scale(0.4+sc*0.6, 1);
      const cg = g.createRadialGradient(0,-3,1,0,0,14);
      cg.addColorStop(0,'#fff2b0'); cg.addColorStop(0.5,'#ffd24a'); cg.addColorStop(1,'#a86a10');
      g.fillStyle = cg;
      g.beginPath(); g.arc(0,0,14,0,7); g.fill();
      g.fillStyle = '#c99a1a';
      g.beginPath(); g.arc(0,0,8,0,7); g.fill();
      g.restore(); break;
    }
    case 'fire': {
      g.save(); g.translate(p.x, p.y);
      const rg = g.createRadialGradient(0,0,0,0,0,48);
      rg.addColorStop(0,'rgba(255,255,220,0.95)');
      rg.addColorStop(0.35,'rgba(255,170,40,0.9)');
      rg.addColorStop(0.7,'rgba(230,60,10,0.65)');
      rg.addColorStop(1,'rgba(120,10,0,0)');
      g.fillStyle = rg;
      g.beginPath(); g.arc(0,0,48,0,7); g.fill();
      for(let i=1;i<=4;i++){
        const fx = -Math.sign(p.vx||1)*i*24;
        g.fillStyle = 'rgba(255,'+(160-i*26)+',20,'+(0.55-i*0.11)+')';
        g.beginPath(); g.arc(fx, Math.sin(p.t*24+i)*7, 26-i*4.5, 0, 7); g.fill();
      }
      g.restore(); break;
    }
    case 'pillar': {
      g.save();
      const a = clamp(1-p.t/(p.life||1),0,1);
      g.globalAlpha = a;
      const gx = p.x, gy = p.y;
      const grd = g.createLinearGradient(0, gy-p.h/2, 0, gy+p.h/2);
      grd.addColorStop(0,'rgba(255,240,180,0)');
      grd.addColorStop(0.3,'rgba(255,150,30,0.9)');
      grd.addColorStop(0.7,'rgba(255,80,10,0.85)');
      grd.addColorStop(1,'rgba(160,20,0,0)');
      g.fillStyle = grd;
      const wob = Math.sin(p.t*30)*8;
      g.beginPath();
      g.moveTo(gx-p.w/2, gy+p.h/2);
      g.quadraticCurveTo(gx-p.w/2+wob, gy, gx-p.w/3, gy-p.h/2);
      g.lineTo(gx+p.w/3, gy-p.h/2);
      g.quadraticCurveTo(gx+p.w/2+wob, gy, gx+p.w/2, gy+p.h/2);
      g.closePath(); g.fill();
      g.restore(); break;
    }
    case 'fatalityHorse': {
      const dir = Math.sign(p.vx)||1;
      g.save(); g.translate(p.x, p.y+78); g.scale(dir, 1);
      for(let i=0;i<6;i++){
        g.fillStyle = 'rgba(200,160,110,'+(0.55-i*0.08)+')';
        g.beginPath();
        g.ellipse(-70-i*24, -6+Math.sin(p.t*12+i)*3, 34-i*4, 16-i*2, 0,0,7);
        g.fill();
      }
      drawHorseSil(g, 0, 0, 1.4, '#2a1608');
      g.restore(); return;
    }
    case 'fatalityStomp': {
      g.save();
      const pct = clamp(p.t/1.0, 0, 1);
      const y = GROUND - lerp(500, 10, Math.min(1, pct*1.4));
      g.translate(p.x, y); g.scale(1.4, 1.4);
      g.fillStyle = '#4a3520';
      g.beginPath(); g.ellipse(0, 0, 55, 42, 0, 0, 7); g.fill();
      g.fillStyle = '#6a5030';
      g.beginPath(); g.ellipse(-6, -4, 46, 34, 0, 0, 7); g.fill();
      g.fillStyle = '#e0d0b0';
      for(let i=-2;i<=2;i++){ g.beginPath(); g.ellipse(i*16, 30, 8, 6, 0, 0, 7); g.fill(); }
      g.fillStyle = '#4a3520';
      g.fillRect(-30, -180, 60, 180);
      g.restore();
      if(pct>0.95 && !p.slammed){
        p.slammed = true; addShake(28);
        emitDust(game.enemy.x, GROUND, 60); SFX.play('bigHit');
      }
      return;
    }
    case 'fatalityCoin': {
      g.save(); g.translate(p.x, p.y);
      const sc = Math.abs(Math.cos(p.t*15));
      g.scale(0.5+sc*0.5, 1);
      const cg = g.createRadialGradient(0,-3,1,0,0,14);
      cg.addColorStop(0,'#fff2b0'); cg.addColorStop(0.5,'#ffd24a'); cg.addColorStop(1,'#a86a10');
      g.fillStyle = cg;
      g.beginPath(); g.arc(0,0,14,0,7); g.fill();
      g.restore(); return;
    }
    case 'fatalityMagic': {
      g.save(); g.translate(p.x, p.y);
      const rg = g.createRadialGradient(0,0,0,0,0,70);
      rg.addColorStop(0,'rgba(255,255,255,0.95)');
      rg.addColorStop(0.3,'rgba(125,227,255,0.85)');
      rg.addColorStop(0.7,'rgba(120,80,255,0.6)');
      rg.addColorStop(1,'rgba(60,20,180,0)');
      g.fillStyle = rg;
      g.beginPath(); g.arc(0,0,70,0,7); g.fill();
      g.restore(); return;
    }
    case 'fatalityGavel': {
      g.save();
      const pct = clamp(p.t/0.9, 0, 1);
      const y = GROUND - lerp(700, 40, Math.min(1, pct*1.2));
      g.translate(p.x, y);
      g.fillStyle = '#3a2410'; g.fillRect(-140, -60, 280, 110);
      const hg = g.createLinearGradient(-140,-60,140,50);
      hg.addColorStop(0,'#7a5030'); hg.addColorStop(0.5,'#a87850'); hg.addColorStop(1,'#5a3820');
      g.fillStyle = hg; g.fillRect(-134, -54, 268, 98);
      g.strokeStyle = '#3a2410'; g.lineWidth = 6; g.strokeRect(-134,-54,268,98);
      g.fillStyle = '#5a3a1a'; g.fillRect(-16, -400, 32, 350);
      g.restore();
      if(pct>0.95 && !p.slammed){
        p.slammed = true; addShake(30); SFX.play('bigHit');
        emitDust(game.enemy.x, GROUND, 60);
      }
      return;
    }
    case 'fatalitySoul': {
      g.save(); g.translate(p.x, p.y);
      const t = p.t;
      for(let i=0;i<12;i++){
        const a = t*4 + i*0.55;
        const r = 30 + Math.sin(t*3+i)*15;
        const px = Math.cos(a)*r;
        const py = Math.sin(a)*r - t*30;
        const alpha = clamp(1-t/2.5,0,1) * (0.5 + Math.sin(t*6+i)*0.3);
        g.fillStyle = 'rgba(168,240,255,'+alpha+')';
        g.beginPath(); g.arc(px, py, 5+Math.sin(t*8+i)*2, 0, 7); g.fill();
      }
      g.fillStyle = 'rgba(180,240,255,'+(0.6*clamp(1-t/2.5,0,1))+')';
      g.beginPath(); g.arc(0, -t*30, 40, 0, 7); g.fill();
      g.restore(); return;
    }
    case 'fatalityFire': {
      g.save();
      const a = clamp(1-p.t/(p.life||2.5),0,1);
      g.globalAlpha = a;
      const grd = g.createLinearGradient(p.x, GROUND, p.x, GROUND-p.h);
      grd.addColorStop(0,'rgba(255,220,80,0.95)');
      grd.addColorStop(0.4,'rgba(255,120,20,0.9)');
      grd.addColorStop(0.8,'rgba(200,30,10,0.6)');
      grd.addColorStop(1,'rgba(80,10,0,0)');
      g.fillStyle = grd;
      const wob = Math.sin(p.t*20)*14;
      g.beginPath();
      g.moveTo(p.x-p.w/2, GROUND);
      g.quadraticCurveTo(p.x-p.w/3+wob, GROUND-p.h/2, p.x-20, GROUND-p.h);
      g.lineTo(p.x+20, GROUND-p.h);
      g.quadraticCurveTo(p.x+p.w/3+wob, GROUND-p.h/2, p.x+p.w/2, GROUND);
      g.closePath(); g.fill();
      g.restore(); return;
    }
  }
}

function skyGrad(stops){
  const g = ctx.createLinearGradient(0,0,0,GROUND);
  for(let i=0;i<stops.length;i++) g.addColorStop(stops[i][0], stops[i][1]);
  return g;
}
function groundStrip(c1,c2){
  const g = ctx.createLinearGradient(0,GROUND-6,0,H);
  g.addColorStop(0,c1); g.addColorStop(1,c2);
  ctx.fillStyle = g; ctx.fillRect(0,GROUND-6,W,H-GROUND+6);
  const hi = ctx.createLinearGradient(0,GROUND-6,0,GROUND+8);
  hi.addColorStop(0,'rgba(255,255,255,0.10)');
  hi.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = hi; ctx.fillRect(0,GROUND-6,W,14);
}
function dune(y, amp, off, color){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0,GROUND);
  for(let x=0;x<=W;x+=18)
    ctx.lineTo(x, y + Math.sin((x+off)*0.0038)*amp + Math.sin((x+off)*0.0105)*amp*0.35);
  ctx.lineTo(W,GROUND); ctx.closePath(); ctx.fill();
}
function sun(x,y,r,c1,c2){
  const g = ctx.createRadialGradient(x,y,0,x,y,r*2.8);
  g.addColorStop(0,c1); g.addColorStop(0.35,c2); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*2.8,0,7); ctx.fill();
  ctx.fillStyle = c1; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
}
function building(x,y,w,h,c1,c2){
  const g = ctx.createLinearGradient(x,y,x+w,y+h);
  g.addColorStop(0,c1); g.addColorStop(1,c2);
  ctx.fillStyle = g; ctx.fillRect(x,y,w,h);
  ctx.fillStyle = c1;
  for(let i=0;i<w;i+=26) ctx.fillRect(x+i, y-12, 14, 14);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  for(let yy=y+26; yy<y+h-24; yy+=44)
    for(let xx=x+16; xx<x+w-24; xx+=40)
      ctx.fillRect(xx, yy, 16, 22);
}
function drawElephantSil(g,x,y,s,color){
  g.save(); g.translate(x,y); g.scale(s,s);
  g.fillStyle = color;
  g.beginPath(); g.ellipse(0,-60,80,52,0,0,7); g.fill();
  g.beginPath(); g.ellipse(-70,-70,42,42,0,0,7); g.fill();
  g.beginPath(); g.ellipse(-98,-58,20,18,0,0,7); g.fill();
  g.beginPath(); g.ellipse(-104,-42,10,26,0,0,7); g.fill();
  g.beginPath(); g.ellipse(-40,-16,22,20,0,0,7); g.fill();
  g.beginPath(); g.ellipse(40,-16,22,20,0,0,7); g.fill();
  g.beginPath(); g.moveTo(72,-84); g.quadraticCurveTo(104,-70,86,-24);
  g.lineTo(72,-30); g.quadraticCurveTo(84,-64,64,-76); g.fill();
  g.fillStyle = '#111'; g.beginPath(); g.arc(-78,-78,2.4,0,7); g.fill();
  g.fillStyle = '#fff';
  g.beginPath();
  g.moveTo(-96,-48); g.quadraticCurveTo(-124,-34,-118,-16);
  g.quadraticCurveTo(-116,-30,-92,-38); g.fill();
  g.restore();
}

function drawStage(id, t){
  emitAmbient(id);
  switch(id){
    case 'desert':       return stageDesert(t);
    case 'elephantCity': return stageElephantCity(t);
    case 'egypt':        return stageEgypt(t);
    case 'market':       return stageMarket(t);
    case 'magicPalace':  return stageMagic(t);
    case 'courtyard':    return stageCourtyard(t);
    case 'warehouse':    return stageWarehouse(t);
    case 'hell':         return stageHell(t);
    default:             return stageDesert(t);
  }
}
function stageDesert(t){
  ctx.fillStyle = skyGrad([[0,'#2b1a3d'],[0.4,'#b8512a'],[0.75,'#e08a3c'],[1,'#f5b96a']]);
  ctx.fillRect(0,0,W,GROUND);
  sun(950,290,72,'#ffd98a','rgba(255,170,60,0.5)');
  dune(400,44,0,'#c88a4d'); dune(452,60,400,'#b0763c');
  for(let i=0;i<10;i++)
    drawHorseSil(ctx, 60+i*130+Math.sin(t*0.4+i)*4, 470, 0.55, 'rgba(70,42,24,0.75)');
  for(let i=0;i<5;i++)
    drawHorseSil(ctx, 180+i*220+Math.sin(t*0.5+i*2)*5, 520, 0.85, 'rgba(50,30,16,0.85)');
  dune(520,30,900,'#9a6430');
  groundStrip('#e0a860','#7d5024');
  ctx.strokeStyle='rgba(255,220,150,0.10)'; ctx.lineWidth=2;
  for(let i=0;i<7;i++){
    const yy = 430+i*22;
    ctx.beginPath();
    ctx.moveTo(0, yy+Math.sin(t*2+i)*3);
    for(let x=0;x<=W;x+=40) ctx.lineTo(x, yy+Math.sin((x*0.01)+t*2+i)*3);
    ctx.stroke();
  }
}
function stageElephantCity(t){
  ctx.fillStyle = skyGrad([[0,'#1f2a44'],[0.45,'#5b6a86'],[0.8,'#c1a274'],[1,'#e3c38c']]);
  ctx.fillRect(0,0,W,GROUND);
  sun(300,250,60,'rgba(255,235,190,0.85)','rgba(255,200,120,0.35)');
  for(let i=0;i<12;i++){
    const x = i*118-30;
    const h = 150+(i%4)*60;
    building(x, GROUND-140-h, 100, h+140, '#8b7355','#5d4c38');
  }
  drawElephantSil(ctx, 1000, GROUND-30, 1.5, 'rgba(236,232,224,0.92)');
  drawElephantSil(ctx, 1120, GROUND-10, 1.2, 'rgba(210,205,196,0.75)');
  for(let i=0;i<4;i++){
    const x = 40+i*400;
    const pg = ctx.createLinearGradient(x,0,x+34,0);
    pg.addColorStop(0,'#7a6444'); pg.addColorStop(0.5,'#a08a64'); pg.addColorStop(1,'#6a542a');
    ctx.fillStyle = pg;
    ctx.fillRect(x, GROUND-260, 34, 260);
    ctx.fillStyle = '#86724e'; ctx.fillRect(x-8, GROUND-274, 50, 20);
  }
  groundStrip('#c9b48a','#6c5a3c');
}
function stageEgypt(t){
  ctx.fillStyle = skyGrad([[0,'#0e1630'],[0.45,'#3a2a55'],[0.78,'#c07a3a'],[1,'#f0c070']]);
  ctx.fillRect(0,0,W,GROUND);
  sun(1020,220,58,'#ffe9a8','rgba(255,190,80,0.4)');
  function pyr(cx,base,h,c1,c2){
    const g = ctx.createLinearGradient(cx-base/2,0,cx+base/2,0);
    g.addColorStop(0,c1); g.addColorStop(0.5,c2); g.addColorStop(1,c1);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(cx, GROUND-h); ctx.lineTo(cx+base/2, GROUND); ctx.lineTo(cx-base/2, GROUND);
    ctx.closePath(); ctx.fill();
  }
  pyr(220,460,300,'#6e5a3a','#b59a68');
  pyr(620,380,250,'#63512f','#a08c5c');
  pyr(980,300,190,'#584726','#8f7c50');
  ctx.fillStyle='#c9a961';
  ctx.beginPath();
  ctx.moveTo(1130, GROUND-320); ctx.lineTo(1160, GROUND-300);
  ctx.lineTo(1160, GROUND); ctx.lineTo(1100, GROUND);
  ctx.lineTo(1100, GROUND-300); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#a89060'; ctx.fillRect(420, GROUND-190, 120, 190);
  ctx.beginPath(); ctx.ellipse(480, GROUND-215, 62, 55, 0,0,7); ctx.fill();
  ctx.fillStyle='#8b7548'; ctx.fillRect(430, GROUND-230, 100, 34);
  groundStrip('#e2c58c','#7d6136');
}
function stageMarket(t){
  ctx.fillStyle = skyGrad([[0,'#2a1c30'],[0.5,'#7a4a3a'],[1,'#d9a066']]);
  ctx.fillRect(0,0,W,GROUND);
  sun(640,300,50,'rgba(255,220,150,0.5)','rgba(255,170,80,0.2)');
  for(let i=0;i<8;i++) building(i*170-20, GROUND-330, 140, 330, '#6b4a34','#3e2b1e');
  function stall(x,y,w,c1,c2){
    ctx.fillStyle = '#5a3a22'; ctx.fillRect(x,y,w,150);
    for(let i=0;i<w;i+=28){
      ctx.fillStyle = (i/28)%2?c1:c2;
      ctx.fillRect(x+i, y-46, 26, 46);
    }
    ctx.fillStyle='#3a2414'; ctx.fillRect(x,y-52,w,8);
    ctx.fillStyle='#e8c34a';
    for(let i=0;i<5;i++){ ctx.beginPath(); ctx.arc(x+20+i*26, y+34, 11, 0, 7); ctx.fill(); }
  }
  stall(80, GROUND-160, 220, '#c0392b','#e8d8b0');
  stall(430, GROUND-150, 200, '#2e6b8a','#e8d8b0');
  stall(820, GROUND-170, 240, '#7a4a9a','#e8d8b0');
  for(let i=0;i<6;i++){
    const x = 330+i*160;
    ctx.fillStyle = i%2?'#a86a3a':'#8a5228';
    ctx.beginPath(); ctx.ellipse(x, GROUND-40, 22, 40, 0, 0, 7); ctx.fill();
    ctx.fillStyle='#6a4020';
    ctx.beginPath(); ctx.ellipse(x, GROUND-76, 13, 8, 0, 0, 7); ctx.fill();
  }
  groundStrip('#c49a68','#6b4a28');
}
function stageMagic(t){
  ctx.fillStyle = skyGrad([[0,'#090516'],[0.5,'#1e1040'],[1,'#3a1f5c']]);
  ctx.fillRect(0,0,W,GROUND);
  for(let i=0;i<6;i++){
    const x = 40+i*230;
    const g = ctx.createLinearGradient(x,0,x+70,0);
    g.addColorStop(0,'#2a1c48'); g.addColorStop(0.5,'#553a86'); g.addColorStop(1,'#2a1c48');
    ctx.fillStyle = g; ctx.fillRect(x,120,70,GROUND-120);
    ctx.fillStyle='#6b4aa8';
    ctx.fillRect(x-14, 100, 98, 30);
    ctx.fillRect(x-14, GROUND-26, 98, 26);
  }
  for(let i=0;i<9;i++){
    const px = 100+i*140+Math.sin(t*0.8+i)*40;
    const py = 180+Math.sin(t*1.3+i*1.7)*70;
    const r = 12+Math.sin(t*2+i)*4;
    const g = ctx.createRadialGradient(px,py,0,px,py,r*4);
    g.addColorStop(0,'rgba(190,140,255,0.95)');
    g.addColorStop(0.4,'rgba(120,80,220,0.5)');
    g.addColorStop(1,'rgba(80,40,180,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(px,py,r*4,0,7); ctx.fill();
  }
  groundStrip('#2a1c44','#100820');
}
function stageCourtyard(t){
  ctx.fillStyle = skyGrad([[0,'#1a2438'],[0.5,'#4a4a6a'],[1,'#c8a878']]);
  ctx.fillRect(0,0,W,GROUND);
  ctx.fillStyle='#8b7a5c'; ctx.fillRect(0,140,W,GROUND-140);
  for(let i=0;i<10;i++){
    const x = 30+i*130;
    ctx.fillStyle='#6b5c42'; ctx.fillRect(x, GROUND-260, 90, 190);
    ctx.fillStyle='#4a3e2c'; ctx.fillRect(x+12, GROUND-240, 66, 170);
  }
  for(let i=0;i<26;i++){
    const x = (i*53+Math.sin(t*0.7+i)*6)%W;
    const h = 60+(i%3)*10;
    ctx.fillStyle = 'rgba(20,16,14,'+(0.35+(i%4)*0.08)+')';
    ctx.beginPath(); ctx.ellipse(x, GROUND-60-h*0.3, 15, h*0.5, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x, GROUND-60-h*0.85, 11, 0, 7); ctx.fill();
  }
  for(let i=0;i<5;i++){
    const x = 110+i*260;
    const sway = Math.sin(t*1.6+i)*6;
    ctx.fillStyle = i%2?'#8a2020':'#20408a';
    ctx.beginPath();
    ctx.moveTo(x,150); ctx.lineTo(x+70,150);
    ctx.lineTo(x+70+sway, 300); ctx.lineTo(x+35+sway, 270); ctx.lineTo(x+sway, 300);
    ctx.closePath(); ctx.fill();
  }
  groundStrip('#c9b086','#6d5a3c');
}
function stageWarehouse(t){
  ctx.fillStyle = skyGrad([[0,'#08090c'],[0.6,'#141820'],[1,'#1e242e']]);
  ctx.fillRect(0,0,W,GROUND);
  for(let i=0;i<16;i++){
    ctx.fillStyle = i%2?'#161b22':'#12161c';
    ctx.fillRect(i*80, 0, 80, GROUND);
  }
  ctx.strokeStyle='rgba(255,255,255,0.03)'; ctx.lineWidth=2;
  for(let x=0;x<W;x+=24){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,GROUND); ctx.stroke(); }
  for(let i=0;i<3;i++){
    const x = 90+i*400;
    ctx.fillStyle='#2b2f36';

    ctx.fillRect(x, GROUND-190, 300, 14);

      ctx.fillRect(x+14+k*72, GROUND-286, 56, 86);

    }
  }
  for(let i=0;i<6;i++){
    const x = 60+i*210;
    const y = GROUND-90-(i%2)*40;
    ctx.fillStyle = '#4a3520';
    ctx.fillRect(x, y, 110, 90+(i%2)*40);
    ctx.strokeStyle='#2e2012'; ctx.lineWidth=4;
    ctx.strokeRect(x, y, 110, 90+(i%2)*40);
  }
  const flick = 0.55+Math.sin(t*13)*0.08+(Math.random()<0.06?-0.4:0);
  const g = ctx.createRadialGradient(640, 80, 10, 640, 80, 720);
  g.addColorStop(0,'rgba(200,230,255,'+(0.32*flick)+')');

  groundStrip('#22262e','#10131a');
}
function stageHell(t){
  ctx.fillStyle = skyGrad([[0,'#1a0402'],[0.4,'#6b1206'],[0.75,'#c43a10'],[1,'#f07a20']]);
  ctx.fillRect(0,0,W,GROUND);
  for(let i=0;i<9;i++){
    const x = i*150-40;
    const h = 200+(i%3)*120;
    ctx.fillStyle = i%2?'#2a0a06':'#1a0503';
    ctx.beginPath();
    ctx.moveTo(x, GROUND); ctx.lineTo(x+40, GROUND-h);
    ctx.lineTo(x+75, GROUND-h*0.6); ctx.lineTo(x+110, GROUND);
    ctx.closePath(); ctx.fill();
  }
  const g = ctx.createLinearGradient(0,GROUND-70,0,GROUND+40);
  g.addColorStop(0,'#ff9a2a'); g.addColorStop(0.4,'#ff4a10'); g.addColorStop(1,'#7a1000');
  ctx.fillStyle = g; ctx.fillRect(0, GROUND-60, W, 70);
  for(let i=0;i<70;i++){
    const ex = (i*137 + t*40*(0.4+(i%5)*0.2))%W;
    const ey = GROUND-20-((t*90+i*61)%620);
    const a = 1-(GROUND-ey)/620;
    ctx.fillStyle = 'rgba(255,'+(120+((i*37)%100))+',40,'+(0.25+a*0.6)+')';
    ctx.beginPath(); ctx.arc(ex, ey, 1.6+(i%3), 0, 7); ctx.fill();
  }
  groundStrip('#3a0e06','#1a0301');
  const hg = ctx.createRadialGradient(640, GROUND+40, 30, 640, GROUND+40, 900);
  hg.addColorStop(0,'rgba(255,120,20,0.35)');
  hg.addColorStop(1,'rgba(255,60,0,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, 0, W, H);
}

function onKO(){
  const p=game.player, e=game.enemy;

  loser.vy=-430; loser.vx=-loser.facing*240; loser.attack=null;
  winner.frozen=true; winner.attack=null; winner.vx=0;
  game.phase='ko'; game.phaseT=0;
  game.announce='K.O.';
  SFX.play('ko'); Music.start('ko');

function update(dt){
  game.t += dt; game.stateT += dt;
  if(shake>0) shake = Math.max(0, shake-dt*70);
  shakeX = (Math.random()-0.5)*shake;
  shakeY = (Math.random()-0.5)*shake;
  camera.zoom += (camera.targetZoom - camera.zoom)*Math.min(1, dt*6);
  if(game.damageFlash>0) game.damageFlash -= dt*2.2;
  if(game.tintFlash){ game.tintFlash.t += dt;
    if(game.tintFlash.t >= game.tintFlash.life) game.tintFlash=null; }
  decayButtonGlow(dt);
  if(game.comboTimer>0){ game.comboTimer -= dt;
    if(game.comboTimer<=0) game.comboCount=0; }
  if(game.hitStop>0){ game.hitStop -= dt; Particles.update(dt); return; }
  switch(game.state){
    case 'logo':      updateLogo(dt); break;
    case 'story':     updateStory(dt); break;
    case 'roster':    updateRoster(dt); break;
    case 'cardDetail':updateCardDetail(dt); break;
    case 'chapter':   updateChapter(dt); break;
    case 'dialogue':  updateDialogue(dt); break;
    case 'intro':     updateIntro(dt); break;
    case 'fight':     updateFight(dt); break;
    case 'fatality':  updateFatality(dt); break;
    case 'victory':   updateVictory(dt); break;
    case 'defeat':    updateDefeat(dt); break;
    case 'gameover':  updateGameOver(dt); break;
    case 'ending':    updateEnding(dt); break;
  }
  Particles.update(dt);
}

function updateFight(dt){
  const p=game.player, e=game.enemy;
  if(!p||!e) return;
  game.phaseT += dt;
  if(game.phase==='ready'){
    if(game.phaseT>1.1 && game.announce!=='FIGHT!'){
      game.announce='FIGHT!'; SFX.play('announce');
    }
    if(game.phaseT>2.0){ game.phase='active'; game.announce=''; }
    p.update(dt*0.7, {}); e.update(dt*0.7, {});
    return;
  }
  if(game.phase==='active'){
    game.roundTime -= dt;
    if(game.roundTime<=0){
      game.roundTime=0;
      if(p.hp>e.hp) e.hp=0; else if(e.hp>p.hp) p.hp=0; else e.hp=0;
      onKO();
    }
    const pin = {
      left: held('left'), right: held('right'),
      up: held('up'), down: held('down'),
      punch: held('punch'), kick: held('kick'),
      block: held('block'), special: held('special')
    };
    const ein = aiThink(e, p, dt);
    p.update(dt, pin); e.update(dt, ein);
    checkMelee(p,e); checkMelee(e,p);
    updateProjectiles(dt);
    const dx = e.x-p.x;
    const minDist = 62;
    if(Math.abs(dx)<minDist && !p.dead && !e.dead){
      const push = (minDist-Math.abs(dx))/2*Math.sign(dx||1);
      p.x -= push*0.5; e.x += push*0.5;
      p.x = clamp(p.x,80,1200); e.x = clamp(e.x,80,1200);
    }
    if(p.hp<=0 || e.hp<=0) onKO();
    return;
  }
  if(game.phase==='ko'){
    const sdt = dt*0.34;
    p.update(sdt, {}); e.update(sdt, {});
    updateProjectiles(sdt);
    if(game.phaseT>2.6){
      const playerWon = (e.hp<=0);
      if(playerWon){
        game.state='fatality'; game.stateT=0;
        game.fatalityTimer = 3.2;
        game.fatalityUsed = false;
        game.fatalityActive = false;
        SFX.play('fatality');
        Music.stop();
      } else {
        game.state='defeat'; game.stateT=0;
        Music.start('ko');
      }
    }
  }
}
function checkMelee(att, def){
  if(!att.attack || att.attack.hit) return;
  if(att.hitstun>0) return;
  const m = att.attack.def; if(!m.hw) return;
  if(att.attack.t < m.startup || att.attack.t > m.startup+m.active) return;
  const hb = getHitbox(att); const bb = bodyBox(def);
  if(rectOverlap(hb,bb)){ att.attack.hit=true; def.takeDamage(m.damage, att, m); }
}
