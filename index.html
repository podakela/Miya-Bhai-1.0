/* ---------- AI ---------- */
function aiThink(me, foe, dt){
  const inp = {left:false,right:false,up:false,down:false,
               punch:false,kick:false,block:false,special:false};
  if(!me || !foe || me.dead || foe.dead || me.frozen) return inp;
  const A = me.def.ai || {agg:0.5, react:0.5};
  const d = Math.abs(foe.x - me.x);
  const dir = foe.x > me.x ? 1 : -1;
  me.aiT -= dt;
  if(me.aiT <= 0){
    const r = Math.random();
    if(d>300) me.aiAct = r<0.88?'approach':'wait';
    else if(d>150) me.aiAct = r<0.55?'approach':(r<0.78?'special':(r<0.9?'wait':'retreat'));
    else {
      if(r<0.34+A.agg*0.30) me.aiAct='attack';
      else if(r<0.68) me.aiAct='block';
      else if(r<0.84) me.aiAct='retreat';
      else me.aiAct='special';
    }
    me.aiT = 0.16 + Math.random()*(0.55-A.react*0.25);
  }
  for(let i=0;i<game.projectiles.length;i++){
    const pr = game.projectiles[i];
    if(pr.owner===me) continue;
    const toward = Math.sign(pr.vx||0)===Math.sign(me.x-pr.x) || (pr.vx===0);
    if(toward && Math.abs(pr.x-me.x)<260 && pr.y>GROUND-260){
      if(Math.random()<0.10+A.react*0.22 && me.onGround) inp.up=true;
      else if(Math.random()<0.35) inp.block=true;
    }
  }
  switch(me.aiAct){
    case 'approach': if(dir>0) inp.right=true; else inp.left=true; break;
    case 'retreat':  if(dir>0) inp.left=true; else inp.right=true; break;
    case 'block':    inp.block=true; if(Math.random()<0.12) inp.punch=true; break;
    case 'attack':
      if(d<115){ inp.punch=Math.random()<0.62; if(!inp.punch) inp.kick=true; }
      else if(d<165){ inp.kick=true; }
      else { if(dir>0) inp.right=true; else inp.left=true; }
      break;
    case 'special':
      if(me.specialCd<=0 && d<480 && Math.random()<0.4) inp.special=true;
      else { if(dir>0) inp.right=true; else inp.left=true; }
      break;
  }
  return inp;
}

/* =====================================================================
   RENDER
   ===================================================================== */
function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}
function wrapText(g, text, x, y, maxW, lh){
  const words = text.split(' ');
  let line = '', yy = y;
  for(let i=0;i<words.length;i++){
    const test = line + words[i] + ' ';
    if(g.measureText(test).width > maxW && line.length){
      g.fillText(line.trim(), x, yy);
      line = words[i] + ' ';
      yy += lh;
    } else line = test;
  }
  g.fillText(line.trim(), x, yy);
}
function wrapTextRight(g, text, x, y, maxW, lh){
  const words = text.split(' ');
  let line = '', yy = y;
  for(let i=0;i<words.length;i++){
    const test = line + words[i] + ' ';
    if(g.measureText(test).width > maxW && line.length){
      g.fillText(line.trim(), x, yy);
      line = words[i] + ' ';
      yy += lh;
    } else line = test;
  }
  g.fillText(line.trim(), x, yy);
}

function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2+shakeX, H/2+shakeY);
  ctx.scale(camera.zoom, camera.zoom);
  ctx.translate(-W/2, -H/2);
  switch(game.state){
    case 'logo':      renderLogo(); break;
    case 'story':     renderStory(); break;
    case 'roster':    renderRoster(); break;
    case 'cardDetail':renderCardDetail(); break;
    case 'chapter':   renderChapter(); break;
    case 'dialogue':  renderDialogue(); break;
    case 'intro':     renderIntro(); break;
    case 'fight':     renderFight(); break;
    case 'fatality':  renderFatality(); break;
    case 'victory':   renderVictory(); break;
    case 'defeat':    renderDefeat(); break;
    case 'gameover':  renderGameOver(); break;
    case 'ending':    renderEnding(); break;
  }
  ctx.restore();
  if(game.damageFlash>0){
    ctx.fillStyle='rgba(255,60,30,'+(game.damageFlash*0.4)+')';
    ctx.fillRect(0,0,W,H);
  }
  if(game.tintFlash){
    const a = 1-game.tintFlash.t/game.tintFlash.life;
    ctx.fillStyle = 'rgba('+game.tintFlash.color+','+(a*0.28)+')';
    ctx.fillRect(0,0,W,H);
  }
  const vg = ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.98);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.62)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
}

function renderLogo(){
  const t = game.t;
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a0508'); g.addColorStop(0.5,'#1c0a08'); g.addColorStop(1,'#3a1206');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  for(let i=0;i<90;i++){
    const ex = (i*173 + t*30*(0.3+(i%4)*0.3))%W;
    const ey = H - ((t*70 + i*53)%(H+120));
    const a = 0.15+(i%5)*0.12;
    ctx.fillStyle = 'rgba(255,'+(120+(i*29)%110)+',30,'+a+')';
    ctx.beginPath(); ctx.arc(ex, ey, 1.4+(i%3)*0.9, 0, 7); ctx.fill();
  }
  const gg = ctx.createRadialGradient(W/2, H-60, 20, W/2, H-60, 700);
  gg.addColorStop(0,'rgba(255,120,20,0.35)');
  gg.addColorStop(1,'rgba(255,60,0,0)');
  ctx.fillStyle = gg; ctx.fillRect(0, H-360, W, 360);
  ctx.save();
  ctx.translate(W/2, 340); ctx.rotate(t*0.35);
  ctx.strokeStyle = 'rgba(255,140,30,0.35)'; ctx.lineWidth = 4;
  for(let i=0;i<3;i++){
    ctx.beginPath();
    ctx.arc(0,0, 190+i*34, i*1.2, i*1.2+4.4);
    ctx.stroke();
  }
  ctx.restore();
  const pulse = 1 + Math.sin(t*2.4)*0.018;
  ctx.save();
  ctx.translate(W/2, 280); ctx.scale(pulse, pulse);
  ctx.shadowColor = '#ff6a10';
  ctx.shadowBlur = 42+Math.sin(t*3)*14;
  bigText('MIYA  BHAI', 0, -40, 118, ['#ffe08a','#ff8a1a'], 1, 1, '#2a0800');
  ctx.shadowBlur = 0;
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.font = '900 34px "Arial Black", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffb060';
  ctx.fillText('NO ONE CAN ESCAPE', W/2, 400);
  ctx.restore();
  const blink = 0.45 + Math.abs(Math.sin(t*3))*0.55;
  bigText('PRESS  ENTER  /  TAP  TO  BEGIN', W/2, 560, 30,
          ['#ffffff','#ffcf80'], blink, 1, '#000');
  if(game.best > 0){
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.font = '700 18px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd070';
    ctx.fillText('BEST SCORE: ' + game.best, W/2, 470);
    ctx.restore();
  }
}

function renderStory(){
  const t = game.t;
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a0610'); g.addColorStop(0.5,'#1a1020'); g.addColorStop(1,'#0a0408');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  for(let i=0;i<80;i++){
    const sx = (i*137 + t*8*(0.3+(i%4)*0.3)) % W;
    const sy = (i*61 + Math.sin(t*0.3+i)*20) % (H-100);
    const a = 0.3 + Math.sin(t*2+i)*0.3;
    ctx.fillStyle = 'rgba(200,220,255,'+clamp(a,0,0.8)+')';
    ctx.beginPath(); ctx.arc(sx, sy, 0.8+(i%3)*0.4, 0, 7); ctx.fill();
  }
  bigText('THE STORY', W/2, 60, 40, ['#ffe9a0','#c88a20'], 1, 1, '#000');
  ctx.save();
  ctx.textAlign = 'center';
  const lines = STORY_SUMMARY;
  const revealCount = Math.min(lines.length, Math.floor(game.stateT * 3.5));
  const baseY = 130;
  for(let i=0;i<revealCount && i<lines.length;i++){
    const line = lines[i];
    if(line === '') continue;
    if(line === 'MIYA BHAI — NO ONE CAN ESCAPE'){
      ctx.save();
      ctx.font = '900 26px "Arial Black", Arial, sans-serif';
      ctx.fillStyle = '#ffe27a';
      ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
      ctx.strokeText(line, W/2, baseY + i*26);
      ctx.fillText(line, W/2, baseY + i*26);
      ctx.restore();
      continue;
    }
    ctx.fillStyle = i>lines.length-6 ? '#ffcc80' : '#e8dcc0';
    ctx.font = i>lines.length-6 ? '900 19px "Arial Black", sans-serif' : '600 17px Arial, sans-serif';
    ctx.fillText(line, W/2, baseY + i*26);
  }
  ctx.restore();
  if(game.stateT > 0.8){
    const blink = 0.5 + Math.abs(Math.sin(t*3))*0.5;
    bigText('PRESS  ENTER  TO  CONTINUE', W/2, H-30, 20,
            ['#ffffff','#ffcf80'], blink, 1, '#000');
  }
}

function renderRoster(){
  const t = game.t;
  game.rosterRectCache = [];
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0b0714'); g.addColorStop(0.6,'#1a0f22'); g.addColorStop(1,'#2b1220');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(255,120,40,0.06)'; ctx.lineWidth = 1;
  for(let x=-((t*40)%80); x<W; x+=80){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<H;y+=80){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  bigText('THE CHALLENGERS', W/2, 46, 34, ['#ffd070','#e05a10'], 1, 1, '#000');
  ctx.save();
  ctx.globalAlpha = 0.75;
  ctx.font = '600 13px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#c89060';
  ctx.fillText('TAP ANY CARD FOR DETAILS  ·  PRESS ENTER TO BEGIN STORY MODE', W/2, 72);
  ctx.restore();

  const cols = 3, rows = 3;
  const cw = 340, ch = 180, gapX = 24, gapY = 24;
  const startX = (W - (cols*cw + (cols-1)*gapX))/2;
  const startY = 90;

  for(let i=0;i<9;i++){
    const c = i % cols, r = Math.floor(i/cols);
    const x = startX + c*(cw+gapX);
    const y = startY + r*(ch+gapY);

    let fighter, name, title;
    if(i === 0){
      fighter = getHeroPreview();
      name = MIYA.name; title = MIYA.title;
    } else {
      const idx = i - 1;
      const pv = PREVIEWS[idx];
      pv.animT += 0.016; pv.clothT += 0.016; pv.pose = computePose(pv);
      fighter = pv;
      name = VILLAINS[idx].name; title = VILLAINS[idx].title;
    }
    game.rosterRectCache.push({ x:x, y:y, w:cw, h:ch, index:i });

    const bg = ctx.createLinearGradient(x,y,x,y+ch);
    bg.addColorStop(0,'rgba(30,20,40,0.92)');
    bg.addColorStop(1,'rgba(14,10,20,0.92)');
    ctx.fillStyle = bg;
    roundRect(ctx, x, y, cw, ch, 12); ctx.fill();
    ctx.strokeStyle = i===0 ? 'rgba(140,200,255,0.8)' : 'rgba(220,150,60,0.55)';
    ctx.lineWidth = 2.4;
    roundRect(ctx, x, y, cw, ch, 12); ctx.stroke();

    const faceX = x + 6, faceY = y + 6;
    const faceW = 170, faceH = ch - 12;
    ctx.save();
    ctx.beginPath();
    roundRect(ctx, faceX, faceY, faceW, faceH, 8);
    ctx.clip();
    const faceBg = ctx.createRadialGradient(faceX+faceW/2, faceY+faceH*0.4, 10,
      faceX+faceW/2, faceY+faceH*0.5, faceH*0.9);
    faceBg.addColorStop(0, i===0?'rgba(60,90,140,0.55)':'rgba(120,60,20,0.55)');
    faceBg.addColorStop(1, 'rgba(0,0,0,0.1)');
    ctx.fillStyle = faceBg;
    ctx.fillRect(faceX, faceY, faceW, faceH);

    const s = fighter.s;
    const headWorldX = fighter.x + fighter.facing * s * 1;
    const headWorldY = fighter.y + s * (-126);
    ctx.translate(faceX + faceW/2, faceY + faceH/2 - 10);
    const zoom = 3.0;
    ctx.scale(zoom, zoom);
    ctx.translate(-headWorldX, -headWorldY);
    drawFighter(ctx, fighter, {skipShadow:true});
    ctx.restore();

    const tx = x + faceW + 22;
    ctx.save();
    ctx.textAlign = 'left';
    ctx.font = '900 17px "Arial Black", Arial, sans-serif';
    ctx.fillStyle = i===0 ? '#cfe6ff' : '#ffd070';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    const shortName = name.length > 18 ? name.slice(0,17)+'…' : name;
    ctx.strokeText(shortName, tx, y + 60);
    ctx.fillText(shortName, tx, y + 60);
    ctx.font = '600 11px Arial, sans-serif';
    ctx.fillStyle = i===0 ? '#9fc0e8' : '#c89050';
    ctx.fillText(title, tx, y + 80);
    ctx.restore();

    if(i>0){
      ctx.save();
      ctx.fillStyle = '#a04010';
      ctx.beginPath(); ctx.arc(x + 20, y + 20, 15, 0, 7); ctx.fill();
      ctx.strokeStyle = '#ffb060'; ctx.lineWidth = 2; ctx.stroke();
      ctx.font = '900 14px "Arial Black", sans-serif';
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(i), x + 20, y + 20);
      ctx.restore();
    }
  }
  if(tapped('back')){ game.state='logo'; game.stateT=0; Music.start('title'); }
}

function renderCardDetail(){
  const idx = game.cardIndex;
  let fighter, name, title, bio, isHero;
  if(idx === 0){
    fighter = getHeroPreview();
    name = MIYA.name; title = MIYA.title; bio = MIYA.bio; isHero = true;
  } else {
    const vi = idx - 1;
    const pv = PREVIEWS[vi];
    pv.animT += 0.016; pv.clothT += 0.016; pv.pose = computePose(pv);
    fighter = pv;
    name = VILLAINS[vi].name; title = VILLAINS[vi].title;
    bio = VILLAINS[vi].bio; isHero = false;
  }
  const t = game.t;
  const g = ctx.createLinearGradient(0,0,0,H);
  if(isHero){
    g.addColorStop(0,'#08142a'); g.addColorStop(0.5,'#0e2040'); g.addColorStop(1,'#050a18');
  } else {
    g.addColorStop(0,'#1a0808'); g.addColorStop(0.5,'#2a0e0c'); g.addColorStop(1,'#0a0404');
  }
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.globalAlpha = 0.08;
  ctx.strokeStyle = isHero ? '#6fa8ff' : '#ff8030';
  ctx.lineWidth = 3;
  for(let i=0;i<40;i++){
    const y = (i*37 + t*300)%H;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y+60); ctx.stroke();
  }
  ctx.restore();

  ctx.save();
  ctx.beginPath(); roundRect(ctx, 40, 110, 460, 540, 16); ctx.clip();
  const panelGrad = ctx.createRadialGradient(270, 380, 40, 270, 380, 380);
  panelGrad.addColorStop(0, isHero?'rgba(60,110,180,0.45)':'rgba(150,60,20,0.45)');
  panelGrad.addColorStop(1, 'rgba(0,0,0,0.3)');
  ctx.fillStyle = panelGrad;
  ctx.fillRect(40, 110, 460, 540);
  ctx.save();
  ctx.translate(270, 640);
  const scale = 2.1;
  ctx.scale(scale * (isHero ? 1 : -1), scale);
  ctx.translate(-fighter.x, -fighter.y);
  drawFighter(ctx, fighter, {skipShadow:true});
  ctx.restore();
  ctx.restore();
  ctx.strokeStyle = isHero ? '#6fa8ff' : '#c88030';
  ctx.lineWidth = 3;
  roundRect(ctx, 40, 110, 460, 540, 16); ctx.stroke();

  bigText(name, 530, 160, 44, isHero?['#ffffff','#9fc8ff']:['#ffd070','#e04a10'], 1, 1, '#000');
  ctx.save();
  ctx.font = '700 20px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = isHero ? '#8fb8e8' : '#c89060';
  ctx.fillText(title, 532, 205);
  ctx.restore();

  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  roundRect(ctx, 520, 240, 720, 260, 12); ctx.fill();
  ctx.strokeStyle = isHero ? 'rgba(110,168,255,0.6)' : 'rgba(200,128,48,0.6)';
  ctx.lineWidth = 2;
  roundRect(ctx, 520, 240, 720, 260, 12); ctx.stroke();
  ctx.font = '600 18px Arial, sans-serif';
  ctx.fillStyle = '#e8dcc0';
  ctx.textAlign = 'left';
  wrapText(ctx, bio, 540, 270, 680, 28);
  ctx.restore();

  if(!isHero){
    const vi = idx - 1;
    const v = VILLAINS[vi];
    drawStatBar(540, 540, 'POWER', v.power/1.3, '#ff5a20');
    drawStatBar(540, 580, 'SPEED', v.speed/340, '#ffcf40');
    drawStatBar(540, 620, 'VITALITY', v.hp/170, '#7dff9a');
  } else {
    drawStatBar(540, 540, 'POWER', MIYA.power/1.3, '#6fa8ff');
    drawStatBar(540, 580, 'SPEED', MIYA.speed/340, '#8fd8ff');
    drawStatBar(540, 620, 'VITALITY', MIYA.hp/170, '#a8ffd0');
  }

  const backX = 40, backY = 40, backW = 200, backH = 54;
  game.backRect = { x:backX, y:backY, w:backW, h:backH };
  ctx.save();
  const backGrd = ctx.createLinearGradient(backX, backY, backX, backY+backH);
  backGrd.addColorStop(0,'rgba(80,40,20,0.9)');
  backGrd.addColorStop(1,'rgba(40,20,10,0.9)');
  ctx.fillStyle = backGrd;
  roundRect(ctx, backX, backY, backW, backH, 10); ctx.fill();
  ctx.strokeStyle = '#c88030'; ctx.lineWidth = 2;
  roundRect(ctx, backX, backY, backW, backH, 10); ctx.stroke();
  ctx.font = '900 20px "Arial Black", Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffd070';
  ctx.fillText('◀  BACK', backX+backW/2, backY+backH/2);
  ctx.restore();
}
function drawStatBar(x, y, label, pct, color){
  pct = clamp(pct, 0, 1);
  ctx.save();
  ctx.font = '900 14px "Arial Black", Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#c8c8c8';
  ctx.fillText(label, x, y);
  const barX = x + 110, barY = y - 10, barW = 500, barH = 20;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  roundRect(ctx, barX, barY, barW, barH, 6); ctx.fill();
  const grd = ctx.createLinearGradient(barX, 0, barX+barW, 0);
  grd.addColorStop(0, color);
  grd.addColorStop(1, shade(color, +40));
  ctx.fillStyle = grd;
  roundRect(ctx, barX, barY, barW*pct, barH, 6); ctx.fill();
  ctx.strokeStyle = '#888'; ctx.lineWidth = 1.5;
  roundRect(ctx, barX, barY, barW, barH, 6); ctx.stroke();
  ctx.restore();
}

function renderChapter(){
  const t = game.stateT;
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a0610'); g.addColorStop(0.5,'#1a0c18'); g.addColorStop(1,'#0a0408');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  const cx = W/2, cy = H/2;
  const rotate = t*0.6;
  for(let i=0;i<5;i++){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotate + i*1.2);
    ctx.strokeStyle = 'rgba(160,120,255,'+(0.25-i*0.04)+')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(0,0, 220+i*60, 80+i*30, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  for(let i=0;i<60;i++){
    const a = (i/60)*Math.PI*2 + t*0.8;
    const r = 180 + Math.sin(t*2+i)*40;
    const px = cx + Math.cos(a)*r*1.5;
    const py = cy + Math.sin(a)*r*0.7;
    ctx.fillStyle = 'rgba(190,140,255,'+(0.4+Math.sin(t*3+i)*0.3)+')';
    ctx.beginPath(); ctx.arc(px, py, 1.5+(i%3), 0, 7); ctx.fill();
  }
  bigText('CHAPTER ' + (game.level+1), W/2, 130, 34, ['#ffe9a0','#c88a20'], 1, 1, '#000');
  bigText(CHAPTER_INTROS[game.level], W/2, 190, 30,
          ['#ffffff','#a080d0'], Math.min(1, t*2), 1, '#000');
  if(t > 0.8){
    const story = LEVEL_STORY_LINES[game.level];
    const alpha = Math.min(1, (t-0.8)*1.5);
    ctx.save();
    ctx.globalAlpha = alpha;
    const boxW = 900, boxH = 130;
    const bx = (W-boxW)/2, by = H-220;
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    roundRect(ctx, bx, by, boxW, boxH, 12); ctx.fill();
    ctx.strokeStyle = 'rgba(200,140,255,0.7)';
    ctx.lineWidth = 2;
    roundRect(ctx, bx, by, boxW, boxH, 12); ctx.stroke();
    ctx.font = '900 15px "Arial Black", sans-serif';
    ctx.fillStyle = '#ffb060';
    ctx.textAlign = 'left';
    ctx.fillText(story.label, bx+24, by+28);
    ctx.font = '600 17px Arial, sans-serif';
    ctx.fillStyle = '#f0e0c0';
    wrapText(ctx, story.line, bx+24, by+56, boxW-48, 24);
    ctx.restore();
  }
  if(t > 1.2){
    const blink = 0.5 + Math.abs(Math.sin(game.t*3))*0.5;
    bigText('PRESS  ENTER  TO  CONTINUE', W/2, H-50, 22,
            ['#ffffff','#ffcf80'], blink, 1, '#000');
  }
}

    const y = (i*37 + t*300)%H;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y+60); ctx.stroke();
  }
  ctx.restore();
  bigText('CHAPTER ' + (game.level+1), W/2, 50, 26, ['#ffe9a0','#e08a20'], 1, 1, '#000');
  bigText(CHAPTER_INTROS[game.level], W/2, 84, 20, ['#c89060','#8a5020'], 1, 1, '#000');

  ctx.restore();

  vp.pose = computePose(vp);

function renderFight(){
  const p = game.player, e = game.enemy;
  if(!p||!e) return;
  drawStage(VILLAINS[game.level].stage, game.t);
  const order = (p.x < e.x) ? [e, p] : [p, e];
  for(let i=0;i<order.length;i++) drawFighter(ctx, order[i]);
  for(let i=0;i<game.projectiles.length;i++) drawProjectile(ctx, game.projectiles[i]);
  Particles.draw(ctx);
  drawHUD();
  if(game.announce && game.phase !== 'active'){
    let a = 1, sc = 1;
    if(game.phase==='ready'){
      const tt = game.phaseT;
      a = clamp(tt<0.2?tt/0.2:(tt>1.8?(2.0-tt)/0.2:1), 0, 1);
      sc = 1 + Math.max(0, 1-tt*4)*0.9;
    } else if(game.phase==='ko'){
      const tt = game.phaseT;
      a = clamp(tt<0.15?tt/0.15:(tt>2.4?(2.6-tt)/0.2:1), 0, 1);
      sc = 1 + Math.max(0, 1-tt*3)*1.4;
    }
    bigText(game.announce, W/2, H/2-40,
            game.phase==='ko'?150:90,
            ['#fff0a0','#ff3a00'], a, sc, '#300000');
  }
  if(game.comboCount > 1 && game.comboTimer > 0){
    const a = Math.min(1, game.comboTimer*2);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'left';
    const x = 60, y = H-130;
    ctx.font = '900 70px "Arial Black", Arial, sans-serif';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 8;
    ctx.strokeText(game.comboCount+'', x, y);
    const grd = ctx.createLinearGradient(0, y-60, 0, y+10);
    grd.addColorStop(0,'#fff0a0'); grd.addColorStop(1,'#ff5a10');
    ctx.fillStyle = grd; ctx.fillText(game.comboCount+'', x, y);
    ctx.font = '900 22px "Arial Black", Arial, sans-serif';
    ctx.fillStyle = '#ffb060';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 5;
    ctx.strokeText('HIT COMBO', x+8, y+26);
    ctx.fillText('HIT COMBO', x+8, y+26);
    ctx.restore();
  }
}

function drawBar(x, y, w, h, pct, isPlayer){
  pct = clamp(pct, 0, 1);
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  roundRect(ctx, x-4, y-4, w+8, h+8, 6); ctx.fill();
  ctx.strokeStyle = '#c8a050'; ctx.lineWidth = 2;
  roundRect(ctx, x-4, y-4, w+8, h+8, 6); ctx.stroke();
  ctx.fillStyle = '#1a0505'; ctx.fillRect(x, y, w, h);
  const fw = w*pct;
  const g2 = ctx.createLinearGradient(0, y, 0, y+h);
  if(pct>0.5){ g2.addColorStop(0,'#b8ffb0'); g2.addColorStop(0.4,'#3ecc40'); g2.addColorStop(1,'#0a6a18'); }
  else if(pct>0.25){ g2.addColorStop(0,'#fff090'); g2.addColorStop(0.4,'#f0a020'); g2.addColorStop(1,'#9a4a00'); }
  else { g2.addColorStop(0,'#ffb0a0'); g2.addColorStop(0.4,'#e02020'); g2.addColorStop(1,'#600000'); }
  ctx.fillStyle = g2;
  if(isPlayer) ctx.fillRect(x, y, fw, h);
  else ctx.fillRect(x+w-fw, y, fw, h);
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.fillRect(x, y+3, w, 7);
  ctx.restore();
}

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd070';
    ctx.strokeStyle = '#3a1a00'; ctx.lineWidth = 6;
    ctx.strokeText('FINAL SCORE: ' + game.score, W/2, 460);
    ctx.fillText('FINAL SCORE: ' + game.score, W/2, 460);
    ctx.restore();
  }
  if(t > 2.5){
    const blink = 0.5 + Math.abs(Math.sin(game.t*3))*0.5;
    bigText('PRESS ENTER TO PLAY AGAIN', W/2, H-80, 24,
            ['#ffffff','#ffd070'], blink, 1, '#2a0800');
  }
}

/* =====================================================================
   CLICK HANDLING
   ===================================================================== */
function handleCanvasClick(x, y){
  if(game.state === 'roster'){
    for(let i=0;i<game.rosterRectCache.length;i++){
      const c = game.rosterRectCache[i];
      if(x>=c.x && x<=c.x+c.w && y>=c.y && y<=c.y+c.h){
        SFX.play('confirm');
        enterCardDetail(c.index);
        return;
      }
    }
  } else if(game.state === 'cardDetail'){
    const b = game.backRect;
    if(b && x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h){
      backToRoster();
      return;
    }
  }
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let lastT = performance.now();
function loop(now){
  let dt = (now-lastT)/1000;
  lastT = now;
  if(dt > 0.05) dt = 0.05;
  if(dt <= 0) dt = 0.016;
  try{
    update(dt);
    render();
  } catch(err){
    console.error('Frame error:', err);
  }
  clearJust();
  requestAnimationFrame(loop);
}

console.log('[MIYA BHAI] booting — canvas', cv.width + 'x' + cv.height,
            '| viewport', window.innerWidth + 'x' + window.innerHeight);
game.state = 'logo';
game.t = 0;
try{
  const b = localStorage.getItem('miyaBhaiBest');
  if(b) game.best = parseInt(b,10) || 0;
}catch(e){}
requestAnimationFrame(loop);

document.addEventListener('visibilitychange', function(){
  if(document.hidden){ Music.stop(); }
  else {
    lastT = performance.now();
    if(game.state==='logo') Music.start('title');
    if(game.state==='story') Music.start('story');
    if(game.state==='roster') Music.start('roster');
  }
});
setInterval(function(){
  if(game.score > game.best){
    game.best = game.score;
    try{ localStorage.setItem('miyaBhaiBest', String(game.best)); }catch(e){}
  }
}, 1000);
